<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex - align-items baseline</title>
    <style>
        .flex-container{
            display: flex;
            align-items: center;
            background-color: black;
        }
        .flex-item-1{
            height: 100px;
            background-color: aqua;
        }
        .flex-item-2{
            height: 150px;
            background-color: blueviolet;    
        }
        .flex-item-3{
            height: 200px;
            background-color: violet;
        }
    </style>
</head>
<body>
    <h1>CSS flex - align-items baseline</h1>
    <div class="flex-container">
        <div class="flex-items flex-item-1">flex-items-1</div>
        <div class="flex-items flex-item-2">flex-items-2</div>
        <div class="flex-items flex-item-3">flex-items-3</div>
    </div>

</body>
</html>
