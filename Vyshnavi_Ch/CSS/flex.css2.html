<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  gap: 10px;
}

.left {
  flex: 2;
  background: orangered;
  height: 200px;
  text-align: center;
}

.right {
  flex: 3;
  display: flex;
  flex-direction: column;
  gap: 10px;
  
}

.top {
  background: greenyellow;
  height: 80px;
  text-align: center;
}

.middle {
  display: flex;
  gap: 10px;
  text-align: center;
}

.middle div {
  flex: 1;
  height: 100px;
}

.box3 { 
    background: pink;
    text-align: center;
    justify-content: center;
    align-items: center;
    
 }
.box4 {
    display: flex; 
    flex-direction: column;
    gap: 10px;
    text-align: center;
    }

.box4 div {
  flex: 1;
  background: blueviolet;
}
</style>
</head>

<body>
<div class="container">
  <div class="left">1</div>

  <div class="right">
    <div class="top">2</div>

    <div class="middle">
      <div class="box3">3</div>
      <div class="box4">
        <div>4a</div>
        <div>4b</div>
      </div>
      
    </div>
    
   </div>
</div>
</body>
</html>
