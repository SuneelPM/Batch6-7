<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css grid example</title>
    <style>
        .grid-container {
            display:grid;
            grid-template-columns: 100px 100px 1fr;
            grid-template-rows: 100%;
            gap:10px;
            height:100vh;
            place-content: center;
            text-align: center;

            
        }
        .grid-items {
            background-color: aqua;
        }

    </style>
</head>
<body>
    <header>HEADER</header>
        <div class="grid-container">
        <div class="grid-items grid-item-1">Inbox</div>
        <div class="grid-items grid-item-2">Message list</div>
        <div class="grid-items grid-item-3">Message</div>
        </div>
        <footer>footer</footer>
</body>
</html>
