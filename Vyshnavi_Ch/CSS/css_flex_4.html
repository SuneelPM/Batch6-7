<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css flex shorthand property</title>
    <style>
        .flex-container{
            display: flex;
            gap: 10px;
            background-color: antiquewhite;
            padding: 30px;
        }
        .flex-items {
            background-color: coral;
            color: rgb(4,4,175);
            width: 100px;
            height: 100px;
            text-align: center;
            place-content: center;
            flex:  200*px;
        }
    </style>
</head>
    <body>
     <h1>css flex shorthand property</h1>
     <div class="flex-container">
          <div class="flex-items flex-item-1">flex-items-1</div>
        <div class="flex-items flex-item-2">flex-items-2</div>
        <div class="flex-items flex-item-3">flex-items-3</div>
        </div>
    </body>
    </html>
