<!DOCTYPE html>
<html>
    <head>
            <title>box model</title>
            <style>
                p{
                    box-sizing: border-box;
                    width: 500px;
                    padding: 10px;
                    margin: 20px;
                    border: 5px solid;
                }
                button{
                    box-sizing: border-box;
                    width: 200px;
                    height: 5%;
                    padding: 10px;
                    border: 1px solid blue;
                    background-color: blanchedalmond;
                    border-radius: 10px;
                }
            </style>
            <body>
            <h1>BOX model</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ex dolor similique autem libero architecto temporibus. Voluptatem porro soluta quam et laborum sit quae repellat perspiciatis reiciendis! Iure amet quaerat mollitia.

            </p>
            <button>click me </button>
        </body>
    </head>
</html>
