<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling Example</title>

    <style>
        /* Style for div */
        div {
            background-color: lightblue;
            border: 2px solid blue;
            border-radius: 50px;
            padding: 10px;
            margin: 10px;
            width: 300px;
        }

        /* Style for ordered list */
        ol {
            color: darkred;
            font-weight: bold;
            background-color: #ffe6e6;
            padding: 10px;
        }

        /* Style for unordered list */
        ul {
            color:fuchsia;
            background-color: #e6ffe6;
            padding: 10px;
            list-style-type: square;
        }

        /* Style for table */
        table {
            border-collapse: collapse;
            width: 300px;
        }

        table, th, td {
            border: 1px solid black;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: gray;
            color: white;
        }

        /* Style for input */
        input {
            padding: 5px;
            margin: 5px;
            border: 2px solid purple;
            border-radius: 5px;
        }

        input:focus {
            background-color: #f0e6ff;
        }
    </style>

</head>
<body>

    <div>
        <h3>Student Details</h3>
        Name: <input type="text"><br>
        Email: <input type="email">
    </div>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>

    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>vyshu</td>
            <td>95</td>
        </tr>
        <tr>
            <td>manoj</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
