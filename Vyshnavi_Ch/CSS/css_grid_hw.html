<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(4,100px);
            gap: 10px;
            /* height: 500vh; */
        }
        .grid-items{
            background-color:aqua;
        }
    </style>
</head>
<body>
    <h1>CSS Grid layout 2</h1>
    <div class="grid-container">
        <div class="grid-items grid-items1">grid-items1</div>
        <div class="grid-items grid-items2">grid-items2</div>
        <div class="grid-items grid-items3">grid-items3</div>
        <div class="grid-items grid-items4">grid-items4</div>
        <div class="grid-items grid-items5">grid-items5</div>
        <div class="grid-items grid-items6">grid-items6</div>
        <div class="grid-items grid-items7">grid-items7</div>
        <div class="grid-items grid-items8">grid-items8</div>
        <div class="grid-items grid-items9">grid-items9</div>
        <div class="grid-items grid-items10">grid-items10</div>
        <div class="grid-items grid-items11">grid-items11</div>
        <div class="grid-items grid-items12">grid-items12</div>
    </div>
</body>
</html>
