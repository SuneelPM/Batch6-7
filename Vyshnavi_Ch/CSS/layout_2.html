<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows:auto;
            gap: 10px;
            height: 500px;

        }
        .gi{
            background-color: rosybrown;
            text-align: center;
            place-content: center;
            
        }
        .gi1{
            background-color: aqua;
            grid-column: 1/4;
            grid-row: 1;
            
        }
        .gi2{
            grid-column:1/2;
            grid-row:2;
            background-color: pink;
        }
        .gi3{
            grid-column: 2/4;
            grid-row: 2/4;
            background-color: gold;
        }
        .gi4{
            grid-column:1/2;
            grid-row:3/5;
            background-color:lightgreen;
        }
        .gi5{
            grid-column:2/4;
            grid-row:4;
            background-color: gray;
        }
        .gi6{
            grid-column:1/3;
            grid-row:5;
            background-color: green;
        }
        .gi7{
            grid-column:3/4;
            grid-row:5;
            background-color: pink;
        }
        .gi8{
            background-color: orangered;
            grid-column:1/4;
            grid-row: 6;
          
        }

    </style>
</head>
<body>
    <h2>CSS Grid layout 4</h2>
    <div class="gc">
        <div class="gi gi1">Header</div>
        <div class="gi gi2">Hero</div>
        <div class="gi gi3">Main Content</div>
        <div class="gi gi4">Sidebar</div>
        <div class="gi gi5">Extra Content</div>
        <div class="gi gi6">Related Images</div>
        <div class="gi gi7">Related Posts</div>
        <div class="gi gi8">Footer</div>

       
        

    </div>
</body>
</html>
