    <script>
        let num = Number(prompt("Enter a number 1 and 7"))
        console.log("user entered:",num);
    //sunday-1
    //monday-2
    //tuesday -3
    // wednesday-4
    //thursday-5
    //firday-6
    //saturday=7
    switch(num){
        case 1:
        console.log("sunday");
        break;
        case 2:
        console.log("monday");
          break;
        case 3:
        console.log("Tuesday");
          break;
        case 4:
        console.log("wednesday");
          break;
        case 5:
        console.log("thursday");
          break;
        case 6:
        console.log("firday");
          break;
        case 7:
        console.log("saturday");
        break;
        default:
        console.log("please enter a number 1 and 7");
    }



   // 100 to 90 grade-A
   // 90 to 80 grade-B 

   let marks = 85;

switch (true) {
    case (marks >= 90 && marks <= 100):
        console.log("Grade A");
        break;

    case (marks >= 80 && marks < 90):
        console.log("Grade B");
        break;

         case (marks >= 70 && marks < 80):
        console.log("Grade c");
        break;

         case (marks >= 60 && marks < 70):
        console.log("Grade D");
        break;

         case (marks >= 50 && marks < 60):
        console.log("Grade E");
        break;

         case (marks >= 40 && marks < 50):
        console.log("Grade F");

    default:
        console.log("Invalid or other grade");
}

    
    </script>
