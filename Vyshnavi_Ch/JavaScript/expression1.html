<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Function Expression</h1>
    <script>
      const sayGoodBye = function () {
        console.log("GoodBye!");
      };
      sayGoodBye();

      const caluclator = function (a, b, operation) {
        if (operation == "+") {
          console.log(a + b);
        } else if (operation == "-") {
          console.log(a - b);
        } else if (operation == "*") {
          console.log(a * b);
        } else if (operation == "/") {
          console.log(a / b);
        } else if (operation == "%") {
          console.log(a % b);
        } else if (operation == "**") {
          console.log(a ** b);
        } else {
          console.log("invalid");
        }
      };
      caluclator(10, 5, "+");

      const greet = function (name) {
        console.log(`Hi ${name},How are you?`);
        console.log("Hi " + name + "," + "How are you?");
      };
      greet("vyshu");
      greet("padhu");
    </script>
  </body>
</html>
