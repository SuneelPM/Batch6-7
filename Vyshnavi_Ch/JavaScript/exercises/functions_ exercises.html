<body>
    <h1>functionexercise</h1>
    <script>

   //write a function 'add(a,b)that returns the sum of two numbers
        function add(a, b) {
    return a + b;
}
console.log(add(10, 20));
 
//create a function 'square(n)' that return the square of a number:-
function square(n) {
    return n * n;
}
console.log(square(5));

//create a function 'sayHello(name)'that returns "Hello,[name]
function sayHello(name) {
    return "Hello, " + name;
}
console.log(sayHello("Vyshnavi"));

//forumla:(base*height)/2.create function 'triArea(b,h)'
function triArea(b, h) {
    return (b * h) / 2;
}
console.log(triArea(10, 5));

//return the last elementnof any array'getLast(arr)'
function getLast(arr) {
    return arr[arr.length - 1];
}
console.log(getLast([10, 20, 30, 40]));
            //(or)
const getLast = function(arr) {
    return arr[arr.length - 1];
}
console.log(getLast([10, 20, 30, 40]));
    </script>
