<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js data types</title>
</head>
<body>
    <script>
        //Number data type
        let num = 10;
        console.log(num);
        console.log(typeof num);

        //string datatype
        let name ="vijay";
        console.log("name:",name, "Datatype:" ,typeof name);

        //boolean datatype true,flase
        let bool = true;
        console.log("log:",bool, "Datatype:",typeof bool);

        //undefined datatype
        let undefinedVar;
        console.log("undefinedVar:",undefinedVar,"Datatype:",typeof undefinedVar);

        // null datatype
        let nullvar = null;
        console.log("nullvar:",nullvar, "Datatype:",typeof nullvar);

        //symbol
        let syml = Symbol("vyshu");
        let sym2 = Symbol();
        console.log("sym1:",syml, "Datatype:",typeof sym1);
        console.log("sym2:",sym2, "Datatype:",typeof sym2);
        console.log(syml == sym2);
        

    </script>
</body>
</html>
