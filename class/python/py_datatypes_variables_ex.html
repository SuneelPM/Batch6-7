      function switchTab(tab) {
        const containers = {
          coding: document.getElementById("coding-container"),
          mcq: document.getElementById("mcq-container"),
          interview: document.getElementById("interview-container"),
        };
        const buttons = {
          coding: document.getElementById("tab-coding"),
          mcq: document.getElementById("tab-mcq"),
          interview: document.getElementById("tab-interview"),
        };

        Object.keys(containers).forEach((key) => {
          containers[key].classList.add("hidden");
          buttons[key].classList.remove("active");
        });

        containers[tab].classList.remove("hidden");
        buttons[tab].classList.add("active");

        // Trigger Prism to highlight the newly visible code
        Prism.highlightAll();
      }

      function renderCodingProblems() {

          card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Code #${prob.id}</span>
                        <span class="tag difficulty-${prob.difficulty}">${prob.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${prob.title}</h3>
                    <p class="text-slate-600 mb-6 leading-relaxed">${prob.description}</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>View Snippet</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="border-t border-slate-200">
                            <!-- PrismJS Markup -->
                            <pre class="line-numbers language-python"><code class="language-python">${prob.solution}</code></pre>
                            <div class="p-3 bg-slate-900 flex justify-end">

                        <span class="w-6 h-6 flex items-center justify-center bg-blue-100 rounded-full text-xs font-bold text-blue-600">${String.fromCharCode(65 + index)}</span>
                        <span class="text-slate-700">${opt}</span>
                    </div>
                `,
            )
            .join("");

          card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">MCQ #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>

                    <h3 class="text-xl font-bold text-slate-800 mb-4">${item.question}</h3>

        const container = document.getElementById("interview-container");
        interviewQs.forEach((item) => {
          const card = document.createElement("div");
          card.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Q #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-slate-700 font-semibold mb-4 italic">"${item.question}"</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Reveal Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-green-50 border-t border-slate-200">
                            <p class="text-green-900 leading-relaxed">${item.answer}</p>
                        </div>
                    </details>
                `;
          container.appendChild(card);
        });
      }

      function copyCode(btn) {
        const code =
          btn.parentElement.previousElementSibling.querySelector(
            "code",
          ).innerText;
        const tempInput = document.createElement("textarea");
        tempInput.value = code;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = originalHtml;
        }, 2000);
      }

      // Initial Rendering
      renderCodingProblems();
      renderMCQs();
      renderInterviewQs();

      // Initial highlight
      Prism.highlightAll();
    </script>
  </body>
</html>
