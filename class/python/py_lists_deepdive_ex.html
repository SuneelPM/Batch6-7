          answer:
            "Yes, deepcopy() keeps a memo dictionary of objects it has already copied to avoid infinite recursion.",
        },
        {
          id: 20,
          title: "Slicing assignment",
          difficulty: "hard",
          question: "What does L[1:3] = [9, 8, 7] do if L = [1, 2, 3, 4]?",
          answer:
            "It replaces the slice [2, 3] with the new list [9, 8, 7]. The list length changes, and the result is [1, 9, 8, 7, 4].",
        },
      ];

      function switchTab(tab) {
        const containers = {
          coding: document.getElementById("coding-container"),
          mcq: document.getElementById("mcq-container"),
          interview: document.getElementById("interview-container"),
        };
        const buttons = {
          coding: document.getElementById("tab-coding"),
          mcq: document.getElementById("tab-mcq"),
          interview: document.getElementById("tab-interview"),
        };

        Object.keys(containers).forEach((key) => {
          containers[key].classList.add("hidden");
          buttons[key].classList.remove("active");
        });

        containers[tab].classList.remove("hidden");
        buttons[tab].classList.add("active");
        Prism.highlightAll();
      }

      function renderCoding() {
        const container = document.getElementById("coding-container");
        codingData.forEach((item) => {
          const div = document.createElement("div");
          div.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          div.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Code Challenge #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-slate-600 mb-6 leading-relaxed">${item.description}</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Reveal Python Code</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="border-t border-slate-200">
                            <pre class="line-numbers language-python"><code class="language-python">${item.solution}</code></pre>
                            <div class="p-2 bg-slate-900 flex justify-end">
                                <button onclick="copyCode(this)" class="text-slate-400 hover:text-white text-xs flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> Copy
                                </button>
                            </div>
                        </div>
                    </details>
                `;
          container.appendChild(div);
        });
      }

      function renderMCQ() {
        const container = document.getElementById("mcq-container");
        mcqData.forEach((item) => {
          const div = document.createElement("div");
          div.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          const opts = item.options
            .map(
              (o, i) => `
                    <div class="flex items-center gap-3 p-2 rounded-md hover:bg-slate-50 border border-transparent">
                        <span class="w-6 h-6 flex items-center justify-center bg-emerald-100 rounded-full text-xs font-bold text-emerald-600">${String.fromCharCode(65 + i)}</span>
                        <span class="text-slate-700">${o}</span>
                    </div>
                `,
            )
            .join("");

          div.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">MCQ #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-4">${item.question}</h3>
                    <div class="space-y-2 mb-6">${opts}</div>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Check Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-emerald-50 border-t border-slate-200">
                            <p class="text-emerald-900 font-medium">Correct Answer:</p>
                            <p class="text-emerald-700 mt-1">${item.answer}</p>
                        </div>
                    </details>
                `;
          container.appendChild(div);
        });
      }

      function renderInterview() {
        const container = document.getElementById("interview-container");
        interviewData.forEach((item) => {
          const div = document.createElement("div");
          div.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          div.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Q #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-slate-700 font-semibold mb-4 italic">"${item.question}"</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Reveal Expert Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-green-50 border-t border-slate-200">
                            <p class="text-green-900 leading-relaxed">${item.answer}</p>
                        </div>
                    </details>
                `;
          container.appendChild(div);
        });
      }

      function copyCode(btn) {
        const code =
          btn.parentElement.previousElementSibling.querySelector(
            "code",
          ).innerText;
        const temp = document.createElement("textarea");
        temp.value = code;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = original;
        }, 2000);
      }

      // Initialize
      renderCoding();
      renderMCQ();
      renderInterview();
      Prism.highlightAll();
    </script>
  </body>
</html>
