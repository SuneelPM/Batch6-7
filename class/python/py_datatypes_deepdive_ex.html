      function switchTab(tab) {
        const containers = {
          coding: document.getElementById("coding-container"),
          mcq: document.getElementById("mcq-container"),
          interview: document.getElementById("interview-container"),
        };
        const buttons = {
          coding: document.getElementById("tab-coding"),
          mcq: document.getElementById("tab-mcq"),
          interview: document.getElementById("tab-interview"),
        };

        Object.keys(containers).forEach((key) => {
          containers[key].classList.add("hidden");
          buttons[key].classList.remove("active");
        });

        containers[tab].classList.remove("hidden");
        buttons[tab].classList.add("active");
        Prism.highlightAll();
      }

                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Challenge #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-slate-600 mb-6 leading-relaxed">${item.description}</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Reveal Python Code</span>

                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Check Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-indigo-50 border-t border-slate-200">
                            <p class="text-indigo-900 font-medium">Solution:</p>
                            <p class="text-indigo-700 mt-1">${item.answer}</p>
                        </div>
                    </details>
                `;
          container.appendChild(div);
        });
      }

      function renderInterview() {
        const container = document.getElementById("interview-container");
        interviewData.forEach((item) => {
          const div = document.createElement("div");
          div.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          div.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Interview Q #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-slate-700 font-semibold mb-4 italic">"${item.question}"</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Show Detailed Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-emerald-50 border-t border-slate-200">
                            <p class="text-emerald-900 leading-relaxed">${item.answer}</p>
                        </div>
                    </details>
                `;
          container.appendChild(div);
        });
      }

      function copyCode(btn) {
        const code =
          btn.parentElement.previousElementSibling.querySelector(
            "code",
          ).innerText;
        const temp = document.createElement("textarea");
        temp.value = code;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = original;
        }, 2000);
      }

      // Initialize
      renderCoding();
      renderMCQ();
      renderInterview();
      Prism.highlightAll();
    </script>
  </body>
</html>
