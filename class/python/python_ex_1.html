<!doctype html>
<html lang="en">
  <head>

    <title>Python Practice Hub: Coding, MCQs & Interview Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
        scroll-behavior: smooth;
      }

      code,
      pre {
        font-family: "Fira Code", monospace;
      }

      .problem-card {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .problem-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }

      details summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      details summary::-webkit-details-marker {
        display: none;
      }

      .difficulty-easy {
        background-color: #dcfce7;
        color: #166534;
      }
      .difficulty-medium {
        background-color: #fef9c3;
        color: #854d0e;
      }
      .difficulty-hard {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .tag {
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }

      .nav-btn.active {
        background-color: #0f172a;
        color: white;
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <header class="mb-12 text-center">
        <h1 class="text-4xl font-bold text-slate-900 mb-4">
          Python Beginner Bootcamp
        </h1>
        <p class="text-slate-600 text-lg mb-8">
          Comprehensive prep with 20 Coding Challenges, 20 MCQs, and 20
          Interview Questions.
        </p>

        <!-- Navigation Tabs -->
        <div
          class="flex flex-wrap justify-center gap-2 mb-8 bg-slate-200 p-1 rounded-lg w-fit mx-auto"
        >
          <button
            onclick="switchTab('coding')"
            id="tab-coding"
            class="nav-btn active px-4 py-2 rounded-md font-semibold transition-all text-sm md:text-base"
          >
            Coding Problems
          </button>
          <button
            onclick="switchTab('mcq')"
            id="tab-mcq"
            class="nav-btn px-4 py-2 rounded-md font-semibold transition-all text-sm md:text-base"
          >
            MCQs
          </button>
          <button
            onclick="switchTab('interview')"
            id="tab-interview"
            class="nav-btn px-4 py-2 rounded-md font-semibold transition-all text-sm md:text-base"
          >
            Interview Qs
          </button>
        </div>

        <div class="flex flex-wrap justify-center gap-4">
          <span class="flex items-center gap-2 text-sm text-slate-500">
            <span class="w-3 h-3 rounded-full bg-green-500"></span> Easy
          </span>
          <span class="flex items-center gap-2 text-sm text-slate-500">
            <span class="w-3 h-3 rounded-full bg-yellow-500"></span> Medium
          </span>
          <span class="flex items-center gap-2 text-sm text-slate-500">
            <span class="w-3 h-3 rounded-full bg-red-500"></span> Hard
          </span>
        </div>
      </header>

      <!-- Container for Coding Problems -->
      <div id="coding-container" class="grid gap-6"></div>

      <!-- Container for MCQs -->
      <div id="mcq-container" class="grid gap-6 hidden"></div>

      <!-- Container for Interview Questions -->
      <div id="interview-container" class="grid gap-6 hidden"></div>
    </div>

      function switchTab(tab) {
        const containers = {
          coding: document.getElementById("coding-container"),
          mcq: document.getElementById("mcq-container"),
          interview: document.getElementById("interview-container"),
        };
        const buttons = {
          coding: document.getElementById("tab-coding"),
          mcq: document.getElementById("tab-mcq"),
          interview: document.getElementById("tab-interview"),
        };

        Object.keys(containers).forEach((key) => {
          containers[key].classList.add("hidden");
          buttons[key].classList.remove("active");
        });

        containers[tab].classList.remove("hidden");
        buttons[tab].classList.add("active");
      }

      function renderCodingProblems() {
        const container = document.getElementById("coding-container");
        problems.forEach((prob) => {
          const card = document.createElement("div");
          card.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Challenge #${prob.id}</span>
                        <span class="tag difficulty-${prob.difficulty}">${prob.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${prob.title}</h3>
                    <p class="text-slate-600 mb-6 leading-relaxed">${prob.description}</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Show Python Solution</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-slate-900 border-t border-slate-200">
                            <pre class="text-green-400 text-sm whitespace-pre-wrap"><code>${prob.solution}</code></pre>
                            <div class="mt-3 flex justify-end">
                                <button onclick="copyCode(this)" class="text-slate-400 hover:text-white text-xs flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> Copy
                                </button>
                            </div>
                        </div>
                    </details>
                `;
          container.appendChild(card);
        });
      }

      function renderMCQs() {

          const optionsHtml = item.options

              (opt, index) => `
                    <div class="flex items-center gap-3 p-2 rounded-md hover:bg-slate-50 border border-transparent">
                        <span class="w-6 h-6 flex items-center justify-center bg-slate-100 rounded-full text-xs font-bold text-slate-500">${String.fromCharCode(65 + index)}</span>
                        <span class="text-slate-700">${opt}</span>
                    </div>
                `,
            )
            .join("");

          card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">MCQ #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-4">${item.question}</h3>
                    <div class="space-y-2 mb-6">${optionsHtml}</div>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Check Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>

          card.className =
            "problem-card bg-white rounded-xl border border-slate-200 p-6";
          card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-slate-400 text-sm font-semibold">Interview Q #${item.id}</span>
                        <span class="tag difficulty-${item.difficulty}">${item.difficulty}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h3>
                    <p class="text-slate-700 font-semibold mb-4 italic">" ${item.question} "</p>
                    <details class="group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                        <summary class="p-3 text-slate-700 font-semibold hover:bg-slate-100 transition-colors">
                            <span>Show Detailed Answer</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="p-4 bg-emerald-50 border-t border-slate-200">
                            <p class="text-emerald-900 leading-relaxed">${item.answer}</p>
                        </div>
                    </details>
                `;
          container.appendChild(card);
        });
      }

      function copyCode(btn) {
        const code = btn.parentElement.previousElementSibling.innerText;
        const tempInput = document.createElement("textarea");
        tempInput.value = code;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = originalHtml;
        }, 2000);
      }

      // Initialize
      renderCodingProblems();
      renderMCQs();
      renderInterviewQs();
    </script>
  </body>
</html>
