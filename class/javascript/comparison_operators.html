<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Comparison operators</h1>
    <script>
      // 0 to 18
      // 18 to 21
      // 21 to 60
      // 60 above

      let age = Number(prompt());
      console.log(age);
      console.log(typeof age);
      console.log(age >= 18 && age <= 21);

      console.log((age > 0 && age <= 18) || (age >= 60 && age < 100));
    </script>
  </body>
</html>
