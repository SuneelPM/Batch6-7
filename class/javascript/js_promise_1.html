    <script>
      //   let success = Number(prompt("Enter a number either 1 or 0"));

      // synchronous promise
      //   let promise1 = new Promise((resolve, reject) => {

      //     }

      //   promise1
      //     .then((value) => console.log(value))
      //     .catch((error) => console.log(error));

      // async promise
      let promise2 = new Promise((resolve, reject) => {
        setTimeout(() => {
          let success = Number(prompt("Enter a number either 1 or 0"));
          if (success) {
            resolve("Successful");
          } else {
            reject("Failure");
          }
        }, 1000);
      });

      function sayHello() {
        console.log("hello");
      }
      setTimeout(sayHello, 1000);
      setInterval(sayHello, 1000);

      console.log("start");
      promise2
        .then((value) => console.log(value))
        .catch((error) => console.log(error));
      console.log("end");
    </script>
  </body>
