<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <h1>Arrow functions</h1>
    <script>
      // write an arrow function that return factorial of n
      //   const factorial = (n) => (n == 0 || n == 1 ? 1 : n * factorial(n - 1));

      const factorial = (n) =>
        n < 0
          ? "Enter a positive integer"
          : n == 0 || n == 1
            ? 1
            : factorial(n - 1);
      console.log(factorial(4));
    </script>
  </body>
</html>
