<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functions with Return statement</title>
  </head>
  <body>
    <h1>Functions with Return statement</h1>
    <script>
      function sum1(num1, num2) {
        return num1 + num2;
      }

      function sum2(num1, num2) {
        console.log(num1 + num2);
      }

      let a = sum1(12, 13);
      let b = sum2(20, 30);

      console.log(a, b);

      function greet(name) {
        let str = `Hi ${name}, How are you?`;
        return str;
      }
    </script>
  </body>
</html>
