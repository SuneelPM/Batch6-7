        },
        {
          q: "Get the ASCII code of the first character in 'str'.",
          a: "str.charCodeAt(0);",
        },
        {
          q: "Compare if 'apple' comes before 'banana' alphabetically.",
          a: "'apple' < 'banana';",
        },
        { q: "Calculate the remainder of -7 % 3.", a: "-7 % 3; // -1" },
        { q: "Check if 'status' is not 'active'.", a: "status !== 'active';" },
        {
          q: "Return 'high' if x > 10, 'mid' if x > 5, else 'low' using nested ternaries.",
          a: "x > 10 ? 'high' : (x > 5 ? 'mid' : 'low');",
        },
        {
          q: "What is the type of a Class declaration?",
          a: "typeof class {}; // 'function'",
        },
        { q: "Check if 'this' is defined.", a: "typeof this !== 'undefined';" },
      ];

      function switchTab(tab) {
        currentTab = tab;
        document
          .getElementById("tab-quiz")
          .classList.toggle("active-tab", tab === "quiz");
        document
          .getElementById("tab-quiz")
          .classList.toggle("text-slate-600", tab !== "quiz");
        document
          .getElementById("tab-interview")
          .classList.toggle("active-tab", tab === "interview");
        document
          .getElementById("tab-interview")
          .classList.toggle("text-slate-600", tab !== "interview");
        document
          .getElementById("tab-coding")
          .classList.toggle("active-tab", tab === "coding");
        document
          .getElementById("tab-coding")
          .classList.toggle("text-slate-600", tab !== "coding");
        renderContent();
      }

      function renderContent() {
        const container = document.getElementById("content-container");
        if (currentTab === "quiz") {
          container.innerHTML = quizData
            .map(
              (item, index) => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition-all hover:shadow-md">
                        <div class="flex items-start gap-4">
                            <span class="flex-shrink-0 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm font-bold text-slate-500">
                                ${index + 1}
                            </span>
                            <div class="flex-1">
                                <p class="text-lg font-semibold text-slate-800 mb-4">${item.q}</p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                                    <div class="p-3 border border-slate-100 rounded-lg bg-slate-50 text-slate-700"><strong>A)</strong> ${item.a}</div>
                                    <div class="p-3 border border-slate-100 rounded-lg bg-slate-50 text-slate-700"><strong>B)</strong> ${item.b}</div>
                                    <div class="p-3 border border-slate-100 rounded-lg bg-slate-50 text-slate-700"><strong>C)</strong> ${item.c}</div>
                                    <div class="p-3 border border-slate-100 rounded-lg bg-slate-50 text-slate-700"><strong>D)</strong> ${item.d}</div>
                                </div>
                                <div class="mt-4">
                                    <button onclick="toggleAnswer(${index})" class="text-indigo-600 hover:text-indigo-800 text-sm font-bold uppercase tracking-wider flex items-center gap-1">
                                        <span id="btn-text-${index}">Show Answer</span>
                                    </button>
                                    <div id="answer-${index}" class="hidden mt-4 p-4 rounded-lg border border-dashed border-slate-300">
                                        <p class="text-sm font-bold text-green-700 mb-1">Correct Answer: ${item.correct.toUpperCase()}</p>
                                        <p class="text-sm text-slate-600">${item.explanation}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
            )
            .join("");
        } else if (currentTab === "interview") {
          container.innerHTML = interviewData
            .map(
              (item, index) => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition-all hover:shadow-md">
                        <div class="flex items-start gap-4">
                            <span class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center text-sm font-bold text-indigo-500">
                                Q${index + 1}
                            </span>
                            <div class="flex-1">
                                <p class="text-lg font-semibold text-slate-800 mb-4">${item.q}</p>
                                <div class="mt-4">
                                    <button onclick="toggleAnswer(${index})" class="text-indigo-600 hover:text-indigo-800 text-sm font-bold uppercase tracking-wider flex items-center gap-1">
                                        <span id="btn-text-${index}">Show Model Answer</span>
                                    </button>
                                    <div id="answer-${index}" class="hidden mt-4 p-5 rounded-lg bg-slate-50 border border-slate-200">
                                        <p class="text-sm leading-relaxed text-slate-700 font-medium">${item.a}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
            )
            .join("");
        } else {
          container.innerHTML = codingData
            .map(
              (item, index) => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition-all hover:shadow-md">
                        <div class="flex items-start gap-4">
                            <span class="flex-shrink-0 w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-sm font-bold text-emerald-600">
                                ${index + 1}
                            </span>
                            <div class="flex-1">
                                <p class="text-lg font-semibold text-slate-800 mb-2">${item.q}</p>
                                <div class="mt-4">
                                    <button onclick="toggleAnswer(${index})" class="text-emerald-600 hover:text-emerald-800 text-sm font-bold uppercase tracking-wider flex items-center gap-1">
                                        <span id="btn-text-${index}">Show Solution</span>
                                    </button>
                                    <div id="answer-${index}" class="hidden mt-4">
                                        <div class="bg-slate-900 rounded-lg p-4 font-mono text-sm text-emerald-400">
                                            <pre><code>${item.a.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
            )
            .join("");
        }
      }

      function toggleAnswer(index) {
        const el = document.getElementById(`answer-${index}`);
        const btnText = document.getElementById(`btn-text-${index}`);

        let showText = "Show Answer";
        let hideText = "Hide Answer";

        if (currentTab === "interview") {
          showText = "Show Model Answer";
          hideText = "Hide Model Answer";
        } else if (currentTab === "coding") {
          showText = "Show Solution";
          hideText = "Hide Solution";
        }

        if (el.classList.contains("hidden")) {
          el.classList.remove("hidden");
          btnText.textContent = hideText;
        } else {
          el.classList.add("hidden");
          btnText.textContent = showText;
        }
      }

      function revealAll() {
        const data =
          currentTab === "quiz"
            ? quizData
            : currentTab === "interview"
              ? interviewData
              : codingData;
        data.forEach((_, i) => {
          const el = document.getElementById(`answer-${i}`);
          const btnText = document.getElementById(`btn-text-${i}`);
          el.classList.remove("hidden");
          btnText.textContent =
            currentTab === "quiz"
              ? "Hide Answer"
              : currentTab === "interview"
                ? "Hide Model Answer"
                : "Hide Solution";
        });
      }

      function hideAll() {
        const data =
          currentTab === "quiz"
            ? quizData
            : currentTab === "interview"
              ? interviewData
              : codingData;
        data.forEach((_, i) => {
          const el = document.getElementById(`answer-${i}`);
          const btnText = document.getElementById(`btn-text-${i}`);
          el.classList.add("hidden");
          btnText.textContent =
            currentTab === "quiz"
              ? "Show Answer"
              : currentTab === "interview"
                ? "Show Model Answer"
                : "Show Solution";
        });
      }

      window.onload = renderContent;
    </script>
  </body>
</html>
