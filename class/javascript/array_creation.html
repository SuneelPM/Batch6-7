      let arr2 = Array(1, 2, 3);
      console.log(arr2);

      // push(item) add element at the end
      arr2.push(4);
      console.log(arr2);
      // pop() removes last element
      arr2.pop();
      console.log(arr2);
      // unshift(item) add element the beginning
      arr2.unshift(0);

      // shift() removes first element
      arr2.shift();
