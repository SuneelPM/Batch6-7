<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
      }

      .grand-parent {
        position: relative;
      }

      .parent {
        height: 500px;
        width: 500px;
        background-color: antiquewhite;
        position: absolute;
        top: 100px;
      }

      .child {
        height: 100px;
        width: 100px;
      }
      .child-1 {
        background-color: aqua;
      }

      .child-2 {
        background-color: blueviolet;
        position: absolute;
        bottom: 100px;
        right: 100px;
      }
      .child-3 {
        background-color: chocolate;
        position: relative;
        top: 0px;
        left: 200px;
      }
    </style>
  </head>
  <body>
    <div class="grand-parent">
      <div class="parent">
        <div class="child-1 child">Child 1</div>
        <div class="child-2 child">Child 2</div>
        <div class="child-3 child">Child 3</div>
      </div>
    </div>
  </body>
</html>
