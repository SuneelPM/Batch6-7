<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
      }

      .layout {
        display: flex;
        flex-direction: column;
        background-color: rgb(249, 230, 224);
        height: 100vh;
        gap: 10px;
        padding: 20px;
      }

      .header {
        background-color: rgb(235, 250, 235);
        flex: 1;
        text-align: center;
        place-content: center;
        font-size: 30px;
        font-weight: bold;
      }

      .footer {
        background-color: rgb(235, 250, 235);
        flex: 1;
        text-align: center;
        place-content: center;
        font-size: 30px;
        font-weight: bold;
      }
      .content {
        flex: 6;
        display: flex;
        gap: 10px;
      }

      .aside {
        background-color: aquamarine;
        flex: 1;
        text-align: center;
        place-content: center;
        font-size: 30px;
        font-weight: bold;
      }

      .article {
        background-color: coral;
        flex: 3;
        display: flex;
        align-items: end;
        gap: 10px;
        padding: 10px;
      }

      .images {
        background-color: bisque;
        height: 100px;
        flex: 1;
        /* margin: 10px; */
        text-align: center;
        place-content: center;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="header">Header</div>
      <div class="content">
        <div class="aside">Aside</div>
        <div class="article">
          <div class="images image-1">Image 1</div>
          <div class="images image-2">Image 2</div>
          <div class="images image-3">Image 3</div>
        </div>
      </div>
      <div class="footer">Footer</div>
    </div>
  </body>
</html>
