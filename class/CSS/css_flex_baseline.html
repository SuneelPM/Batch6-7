<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS flex - align-items baseline</title>
    <style>
      .flex-container {
        display: flex;
        align-items: center;
        gap: 10px;
        background-color: rgb(190, 223, 253);
      }
      .flex-items {
        text-align: center;
        place-content: end;
        width: 200px;
      }
      .flex-item-1 {
        height: 100px;
        background-color: aqua;
      }
      .flex-item-2 {
        height: 150px;
        background-color: blueviolet;
      }
      .flex-item-3 {
        height: 200px;
        background-color: chartreuse;
      }
    </style>
  </head>
  <body>
    <h1>CSS flex - align-items baseline</h1>
    <div class="flex-container">
      <div class="flex-items flex-item-1">Flex Items 1</div>
      <div class="flex-items flex-item-2">Flex Items 2</div>
      <div class="flex-items flex-item-3">Flex Items 3</div>
    </div>
  </body>
</html>
