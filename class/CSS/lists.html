<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Lists & Tables</title>
    <style>
      h1 {
        background-image: url(images/scenary.jpg);
        padding: 20px;
        border: 5px solid rgba(0, 0, 0, 0.29);
        /* color: transparent; */
        background-clip: border-box;
      }

      ul.tasks {
        list-style-type: square;
      }

      li {
        background-color: aqua;
      }

      ol.chapters {
        list-style-type: upper-alpha;
        list-style-position: inside;
        /* list-style-image: url(images/scenary.jpg); */
      }
    </style>
  </head>
  <body>
    <h1>CSS Lists and Tables</h1>
    <ul class="tasks">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
      <li>Item 5</li>
    </ul>

    <ol class="chapters">
      <li>Chapter 1</li>
      <li>Chapter 2</li>
      <li>Chapter 3</li>
      <li>Chapter 4</li>
      <li>Chapter 5</li>
      <li>Chapter 6</li>
      <li>Chapter 7</li>
      <li>Chapter 8</li>
      <li>Chapter 9</li>
      <li>Chapter 10</li>
    </ol>
  </body>
</html>
