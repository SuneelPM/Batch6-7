<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
      }
      .child {
        width: 100px;
        height: 100px;
      }
      .child-1 {
        background-color: aqua;
        position: relative;
        /* top: 10px;
        left: 10px; */
      }
      .child-2 {
        background-color: blueviolet;
        position: relative;
        left: 100px;
        top: -100px;
      }
      .child-3 {
        background-color: chocolate;
        position: relative;
        left: 200px;
        top: -200px;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child-1 child">Child 1</div>
      <div class="child-2 child">Child 2</div>
      <div class="child-3 child">Child 3</div>
    </div>
  </body>
</html>
