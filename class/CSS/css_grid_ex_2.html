<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .gc {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        /* gap: 10px; */
        height: 100vh;
        background-image: url(images/tree.webp);
      }
      .gi {
        background-color: rgba(128, 109, 0, 0.375);
        color: white;
        text-align: center;
        place-content: center;
        border: 5px solid white;
      }
      .gi-1 {
        grid-column: 1 /3;
        grid-row: 1/2;
      }
      .gi-2 {
        grid-column: 3 /4;
        grid-row: 1/3;
      }
      .gi-3 {
        grid-column: 2/3;
        grid-row: 2/3;
      }
      .gi-4 {
        grid-column: 2/4;
        grid-row: 3/4;
      }
      .gi-5 {
        grid-column: 1 /2;
        grid-row: 2/4;
      }
    </style>
  </head>
  <body>
    <div class="gc">
      <div class="gi gi-1">Grid Item 1</div>
      <div class="gi gi-2">Grid Item 2</div>
      <div class="gi gi-3">Grid Item 3</div>
      <div class="gi gi-4">Grid Item 4</div>
      <div class="gi gi-5">Grid Item 5</div>
    </div>
  </body>
</html>
