<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>CSS Flex Day 1</title>
    <style>

      h1 {

      .parent {

        display: flex;

      }
      .child {

        padding: 10px;
        border: 1px solid blue;
        /* height: 200px;

        border-radius: 10px;
        text-align: center;
        place-content: center;
        /* direction: rtl;
        unicode-bidi: bidi-override; */
      }
    </style>

</html>
