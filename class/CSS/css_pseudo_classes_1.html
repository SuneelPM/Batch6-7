<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Pseudo Classes</title>
    <style>
      button {
        background-color: darkorange;
        border: 1px solid red;
        padding: 10px;
        font-size: 20px;
        border-radius: 10px;
      }
      div {
        margin: 10px;
      }

      button:hover {
        background-color: blueviolet;
        box-shadow: 5px 5px 5px 5px lightgrey;
      }

      button:active {
        /* box-shadow: -5px -5px 5px 5px lightgrey; */
        transform: scale(0.9);
      }

      h1:hover {
        color: blue;
      }
      input {
        border: 2px solid blue;
        padding: 10px;
        border-radius: 10px;
      }

      input:focus {
        outline: none;
        border: 2px solid red;
        padding: 10px;
        border-radius: 10px;
      }

      a:link {
        text-decoration: none;
        display: inline-block;
        color: red;
        background-color: rgb(250, 235, 235);
        padding: 10px;
        border: 1px solid red;
        border-radius: 5px;
      }

      a:visited {
        color: green;
      }

      input:disabled {
        border: 2px solid gray;
      }

      input:checked + label {
        font-weight: bold;
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>CSS Pseudo Classes</h1>
    <form action="/submit">
      <div>
        <label for="fn">First Name</label>
        <input type="text" id="fn" />
      </div>
      <div>
        <label for="fn">Middle Name</label>
        <input type="text" id="fn" />
      </div>
      <div>
        <label for="fn">Last Name</label>
        <input type="text" id="fn" disabled value="Tarak" />
      </div>
      <div>
        <a href="https://www.google.com" target="_blank">Google</a>
      </div>
      <hr />
      <div>
        <h3>Qualification</h3>
        <input type="checkbox" name="q" id="x" />
        <label for="x">10th</label>
        <input type="checkbox" name="q" id="i" />
        <label for="x">Intermediate</label>
        <input type="checkbox" name="q" id="d" />
        <label for="x">Degree</label>
        <input type="checkbox" name="q" id="p" />
        <label for="x">Post Graduate</label>
      </div>
    </form>
    <hr />
    <button>Click me</button>
  </body>
</html>
