<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TEMPLATE AREAS</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns:3fr 2fr 2fr;
            grid-template-rows:1fr 1fr 1fr;
            gap:10px;
            height: 200px;
            grid-template-areas: "One Two Two"
                                 "One Three Foura"
                                 "One Three Fourb";
                                 
        }
        .grid-items {
            background-color:cadetblue ;
        }
        .grid-item-1 {
            grid-area:One;
        }
        .grid-item-2 {
            grid-area:Two;
        }.grid-item-3 {
            grid-area:Three;
        }.grid-item-4 {
            grid-area:Foura;
        }
        .grid-item-5 {
            grid-area:Fourb;
        }
    </style>
    </head>
<body>
        <div class="grid-container">
        <div class="grid-items grid-item-1">one</div>
        <div class="grid-items grid-item-2">Two  </div>
        <div class="grid-items grid-item-3">Three</div>
        <div class="grid-items grid-item-4">Foura</div>
        <div class="grid-items grid-item-5">Fourb</div>
    </div>

    
</body>
</html>
