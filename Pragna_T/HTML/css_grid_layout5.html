<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css layout</title>
    <style>
        body{
            padding:20px;
        }
       
        
        .grid-container{
            display:Grid;
            grid-template-columns:1fr 3fr;
            grid-template-rows:120px 120px 140px 80px ;
            gap:10;
           
            

        }
        .grid-items{
            background-color:aqua;
            color:white ;
            text-align:center ;
            place-content:center ;
            border:5px solid white ;
            
        }
        .grid-item-1{
                grid-column:1/2 ;
                grid-row: 1/3;


        }
        .grid-item-2{
            grid-column:2/3 ;
            grid-row:1/2 ;
            

        }
        .grid-item-3{
            grid-column:2/3;
            grid-row:2/3;
            

        }
        .grid-item-4{
            grid-column:1/2;
            grid-row:3/4 ;
            

        }
        .grid-item-5{
            grid-column:2/3;
            grid-row: 3/4;
            

        }
        .grid-item-6{
            grid-column: 1/3;
            grid-row:4/5;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-items grid-item-1">Grid Item 1</div>
        <div class="grid-items grid-item-2">Grid Item 2</div>
        <div class="grid-items grid-item-3">Grid Item 3</div>
        <div class="grid-items grid-item-4">Grid Item 4</div>
        <div class="grid-items grid-item-5">Grid Item 5</div>
        <div class="grid-items grid-item-6">Grid Item 6</div>
    </div>
    
</body>
</html>
