<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css positions absolute</title>
    <style>
        * {
            margin: 0px;

        } 
        .grand-parent {
            position: absolute;
        }
        .parent {
            height: 500px;
            width:500px;
            background-color: antiquewhite;
            position:absolute;
            top: 100px;
        }
        .child {
            height: 100px;
            width: 100px;
        }
        .child-1 {
            background-color: pink;
           
            

        }
        .child-2  {
            background-color: aqua;
            position: absolute;
            bottom: 100px;
            right: 100px;
        }
        .child-3 {
            background-color:lightgreen;
            position: relative;
            top: -100px;
            left: 200px;
        }
    </style>
</head>
<body>
    <div class="grand-parent">
    <div class="parent">
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
    </div>
    </div>
    
    
</body>
</html>
