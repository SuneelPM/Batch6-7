<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css Grid Layout</title>
    <style>
        .grid-container{
            display:Grid;
            grid-template-columns:repeat(3, 1fr) ;
            grid-template-rows: repeat(3, 1fr);
            gap:0;
            height:500px ;

        }
        .grid-items{
            background-color:violet;
            color:white ;
            text-align:center ;
            place-content:center ;
            border:5px solid white ;
            

        }
        <div class="grid-container">
        <div class="grid-items grid-item-1">Grid Item 1</div>
        <div class="grid-items grid-item-2">Grid Item 2</div>
        <div class="grid-items grid-item-3">Grid Item 3</div>
        <div class="grid-items grid-item-4">Grid Item 4</div>
        <div class="grid-items grid-item-5">Grid Item 5</div>
        <div class="grid-items grid-item-6">Grid Item 6</div>
        <div class="grid-items grid-item-5">Grid Item 7</div>
        <div class="grid-items grid-item-6">Grid Item 8</div>
    </div>
            grid-column:2/4 ;
            grid-row:4/5;


        }
        .grid-item-6{
            grid-column: 2/3;
            grid-row:4/5;


        }
        .grid-item-7{
            grid-column:3/4 ;
            grid-row:5/6;


        }
        .grid-item-8{
            grid-column: 5/6;
            grid-row:1/3;


        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-items grid-item-1">Grid Item 1</div>
        <div class="grid-items grid-item-2">Grid Item 2</div>
        <div class="grid-items grid-item-3">Grid Item 3</div>
        <div class="grid-items grid-item-4">Grid Item 4</div>
        <div class="grid-items grid-item-5">Grid Item 5</div>
        <div class="grid-items grid-item-6">Grid Item 6</div>
        <div class="grid-items grid-item-5">Grid Item 7</div>
        <div class="grid-items grid-item-6">Grid Item 8</div>
    </div>
    
    
</body>
</html>
