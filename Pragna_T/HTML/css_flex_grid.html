<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: white;
        }
        h1 {
            color:black;
        }
        .parent {
            display:flex;
            gap: 10px;
        }
        .child {
            flex: 1;
            background-color: rgb(43, 147, 226);
            height:100px ;
            color:white ;
            text-align: center;
            place-content:center ;
        }
        @media screen  and (max-width: 600px){
            body {
                background-color:white ;
            }
            .parent {
                display: block;
            }
            .child {
                margin:10px ;
                border-radius:10px ;
            }
            
        }
    </style>
</head>
<body>
    <h1>CSS Mediaqueries</h1>
    <div class="parent">
        <div class="child child-1">child 1</div>
        <div class="child child-2">child 2</div>
        <div class="child child-3">child 3</div>
    </div>

    
</body>
</html>
