<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS LAYOUT </title>
    <style>
        .grid-container{
            display:Grid;
            grid-template-columns:2fr 1fr;
            grid-template-rows:120px 300px  120px;
            gap:0;
            

        }
        .grid-items{
            background-color:rgb(255, 192, 245);
            color:white ;
            text-align:center ;
            place-content:center ;
            border:5px solid white ;
        }
        /* attr value starts with (^) */
        .grid-container > [class^="grid-items"] {
            color:blue;
        }
         .grid-item-1{
            grid-column:1/3 ;
            grid-row:1/2 ;


        }
        .grid-item-2{
            grid-column:1/2;
            grid-row:2/3 ;
            

        }
        .grid-item-3{
            grid-column:2/3;
            grid-row:2/3;
            

        }
        .grid-item-4{
            grid-column:1/3;
            grid-row:3/4 ;
            

        }
    </style>
</head>
<body>
    
</body>
<div class="grid-container">
        <div class="grid-items grid-item-1">Grid Item 1</div>
        <div class="grid-items grid-item-2">Grid Item 2</div>
        <div class="grid-items grid-item-3">Grid Item 3</div>
        <div class="grid-items grid-item-4">Grid Item 4</div>
    </div>

</html>
