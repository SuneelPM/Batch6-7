<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css positions</title>
    <style>
        *  {
            margin: 0px;

        }
        .child {
    
            width: 100px;
            height: 100px;
        }
        .child-1 {
            position: relative;
            /* top: 10px;
            left: 10px;
            */
           
            background-color: aquamarine;
        }
        .child-2 {
            background-color: blueviolet;
             position: relative;
            bottom: 100px;
            left: 100px;
            
            
            
           
        }
        .child-3 {
            background-color: pink;
            position: relative;
            left: 200px;
            bottom: 200px;
    

        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
    </div>
    
</body>
</html>
