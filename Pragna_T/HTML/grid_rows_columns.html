<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Day2</title>
    <style> 
    .grid-container{
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3,1fr);
        gap: 1rem;
        height: 200px;
    }
    .grid-items{
        background-color: blanchedalmond;
        border-radius:10px ;
        text-align:center ;
        place-content: center;

        
    }
    .grid-item1{
        background-color: red;
        color: white;
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 1;
        grid-row-end: 2;
        text-align: center;
    }
    .grid-item2{
        background-color: gold;
        color: aliceblue;
        grid-column-start: 2;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
        text-align: center;
    }
    .grid-item3{
        background-color: rgb(93, 212, 93);
        color: aliceblue;
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 2;
        grid-row-end: 3;
        text-align: center;
    }
    .grid-item4{
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 3;
        grid-row-end: 4;
        text-align: center;
    }

    </style>
   
</head>
<body>
    <div class="grid-container">
        <div class="grid-items grid-item1">Grid Item1</div>
        <div class="grid-items grid-item2">Grid Item2</div>
        <div class="grid-items grid-item3">Grid Item3</div>
        <div class="grid-items grid-item4">Grid Item4</div>
    </div>
</body>
</html>
