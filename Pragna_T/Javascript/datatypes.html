<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Js DataTypes</title>
  </head>
  <body>
    <script>
      // number datatype
      let num = 10;
      console.log(num);
      console.log(typeof num);

      //   string datatype
      let name = "Pragna";
      console.log(name, typeof name);

      //   Boolean datatype true, false
      let bool = true;
      console.log("bool :", bool, "Datatype:", typeof bool);

      // undefined datatype
      let undefinedVar;
      console.log(
        "undefinedVar:",
        undefinedVar,
        "Datatype:",
        typeof undefinedVar,
      );

      // null datatype
      let nullVar = null;
      console.log("nullVar:", "DataType:", typeof nullVar);

      // Symbol
      let sym1 = Symbol("pragna");
      let sym2 = Symbol();
      console.log("sym1:", sym1, "Datatype:", typeof sym1);
      console.log("sym2:", sym2, "Datatype:", typeof sym2);
      console.log(sym1 == sym2);

      
    </script>
  </body>
</html>
