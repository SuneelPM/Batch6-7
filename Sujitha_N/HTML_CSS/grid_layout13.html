<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .gc{
            display: grid;
            grid-template-columns: 2fr 3fr 1fr 2fr;
            grid-template-rows:1fr 2fr 3fr 1fr;
            gap: 1rem;
            height: 700px;

        }
        .gi{
            background-color: rgb(228, 76, 182);
            text-align: center;
            place-content: center;
        }
        .gi1{
            background-color: slateblue;
            grid-column:1/5 ;
            grid-row: 1/2;
        }
        .gi2{
            background-color: white;
            grid-column: 1/2;
            grid-row: 2/4;
        }
        .gi3{
            background-color: red;
            grid-column:2/4 ;
            grid-row:2/3 ;
        }
        .gi4{
            background-color: green;
            grid-column:2/3 ;
            grid-row:3/4 ;
        }
        .gi5{
            background-color: blue;
            grid-column: 3/4;
            grid-row:3/4 ;
        }
        .gi6{
            background-color: white;
            grid-column:4/5 ;
            grid-row: 2/4;
        }
        .gi7{
            background-color: gray;
            grid-column: 1/5;
            grid-row: 4/5;
        }
    </style>
</head>
<body>
    <div class="gc">
        <div class="gi gi1">gi1</div>
        <div class="gi gi2"></div>
        <div class="gi gi3">gi3</div>
        <div class="gi gi4">gi4</div>
        <div class="gi gi5">gi5</div>
        <div class="gi gi6"></div>
        <div class="gi gi7">gi7</div>
    </div>
</body>
</html>
