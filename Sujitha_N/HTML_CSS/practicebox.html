<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Box Shadows</title>
    <style>
        .box{
            width: 150px;
            height: 150px;
            background-color: #fff;
            border-radius: 8px;
            display: grid;
            /*grid-template-columns: repeat(2, 1fr);
            gap:10px;*/
            align-items: center;
            justify-content: center;
            margin: 20px;
            font-family: sans-serif;
            color: #333;
        }

        .shadow-0{
            box-shadow: rgba(149,157,165,0.2) 0px 8px 24px;
        }

        .shadow-1{
            box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;

        }

        .shadow-2{
            box-shadow: rgba(0, 0, 0, 0.15) 1.95px 1.95px 2.6px;

        }

        .shadow-3{
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .shadow-4{
            box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
        }

        .shadow-5{
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        }

        .shadow-6{
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        }

        .shadow-7{
            box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px, rgb(51, 51, 51) 0px 0px 0px 3px;
        }

        .shadow-8{
            box-shadow: rgba(0, 0, 0, 0.02) 0px 1px 3px 0px, rgba(27, 31, 35, 0.15) 0px 0px 0px 1px;
        }

        .shadow-9{
            box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
        }

        .shadow-10{
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            
        }

        .shadow-11{
            box-shadow: rgba(0, 0, 0, 0.05) 0px 6px 24px 0px, rgba(0, 0, 0, 0.08) 0px 0px 0px 1px;
        }

        .shadow-12{
            box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px, rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
        }

        .shadow-13{
            box-shadow: rgba(17, 12, 46, 0.15) 0px 48px 100px 0px;
        }

        .shadow-14{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
        }

        .shadow-15{
            box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 1px 0px inset, rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
        }

        .shadow-16{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
        }

        .shadow-17{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
        }

        .shadow-18{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px, rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
        }

        .shadow-19{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
        }

        .shadow-20{
            box-shadow: rgb(38, 57, 77) 0px 20px 30px -10px;
        }

        .shadow-21{
            box-shadow: rgba(6, 24, 44, 0.4) 0px 0px 0px 2px, rgba(6, 24, 44, 0.65) 0px 4px 6px -1px, rgba(255, 255, 255, 0.08) 0px 1px 0px inset;

        }

        .shadow-22{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
        }

        .shadow-23{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px, rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
        }

        .shadow-24{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 30px 60px -12px, rgba(0, 0, 0, 0.3) 0px 18px 36px -18px;
        }

        .shadow-25{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset, rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
        }

        .shadow-26{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
        }

        .shadow-27{
            box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 2px;
        }

        .shadow-28{
            box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px;
        }

        .shadow-29{
            box-shadow: rgba(0, 0, 0, 0.19) 0px 10px 20px, rgba(0, 0, 0, 0.23) 0px 6px 6px;
        }

        .shadow-30{
            box-shadow: rgba(0, 0, 0, 0.25) 0px 14px 28px, rgba(0, 0, 0, 0.22) 0px 10px 10px;
        }

        
    </style>
</head>
<body>
    <div class="box shadow-0">#0</div>
    <div class="box shadow-1">#1</div>
    <div class="box shadow-2">#2</div>
    <div class="box shadow-3">#3</div>
    <div class="box shadow-4">#4</div>
    <div class="box shadow-5">#5</div>
    <div class="box shadow-6">#6</div>
    <div class="box shadow-7">#7</div>
    <div class="box shadow-8">#8</div>
    <div class="box shadow-9">#9</div>
    <div class="box shadow-10">#10</div>
    <div class="box shadow-11">#11</div>
    <div class="box shadow-12">#12</div>
    <div class="box shadow-13">#13</div>
    <div class="box shadow-14">#14</div>
    <div class="box shadow-15">#15</div>
    <div class="box shadow-16">#16</div>
    <div class="box shadow-17">#17</div>
    <div class="box shadow-18">#18</div>
    <div class="box shadow-19">#19</div>
    <div class="box shadow-20">#20</div>
    <div class="box shadow-21">#21</div>
    <div class="box shadow-22">#22</div>
    <div class="box shadow-23">#23</div>
    <div class="box shadow-24">#24</div>
    <div class="box shadow-25">#25</div>
    <div class="box shadow-26">#26</div>
    <div class="box shadow-27">#27</div>
    <div class="box shadow-28">#28</div>
    <div class="box shadow-29">#29</div>
    <div class="box shadow-30">#30</div>
    
    



    
    
    

    



    

    

    
</body>
</html>
