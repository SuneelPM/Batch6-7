<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3,1fr);
            gap: 1rem;
            height: 200px;

        }
        .grid-item{
            background-color: pink;
            border-radius: 10px;
            text-align: center;
            place-content: center;
        }
        /* attr value starts with (^) */
        .grid-container > [class^="grid-item"]{
            color: red;
        }
    
        .grid-item1{
            grid-column-start: 1 ;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end:2 ;
        } 
    
        .grid-item2{
            grid-column-start: 2;
            grid-column-end:3;
            grid-row-start:1 ;
            grid-row-end: 3;
        } 
   
        .grid-item3{
            grid-column-start: 1;
            grid-row-start:2 ;
            grid-row-start:2 ;
            grid-row-end: 3;
        } 
        .grid-item4{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 4;
        } 
    </style>
</head>
<body>
    <h1>CSS Grid layout 3</h1>
    <div class="grid-container">
        <div class="grid-item grid-item1">grid-items 1</div>
        <div class="grid-item grid-item2">grid-items 2</div>
        <div class="grid-item grid-item3">grid-items 3</div>
        <div class="grid-item grid-item4">grid-items 4</div>
    </div>
    
</body>
</html>
