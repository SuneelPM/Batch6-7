<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
}

.container {
  display: flex;
  background: #ccc;
  padding: 20px;
}

.box1 {
  background: coral;
  flex: 1;
  height: 200px;
  margin-right: 10px;
}

.right {
  flex: 2;
  display: flex;
  flex-direction: column;
}

.box2 {
  background: lightgreen;
  height: 80px;
  margin-bottom: 10px;
}

.bottom {
  display: flex;
}

.box3 {
  background: orchid;
  flex: 1;
  height: 110px;
  margin-right: 10px;
}

.side {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.box4 {
  background: lightblue;
  flex: 1;
  margin-bottom: 5px;
}
</style>
</head>

<body>

<div class="container">
  <div class="box1">1</div>

  <div class="right">
    <div class="box2">2</div>

    <div class="bottom">
      <div class="box3">3</div>

      <div class="side">
        <div class="box4">4a</div>
        <div class="box4">4b</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
