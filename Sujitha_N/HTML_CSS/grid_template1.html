<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns:1fr 5fr 3fr 1fr ;
            grid-template-rows:1fr 3fr 10fr 1fr ;
            height: 100vh;
            gap: 10px;
            grid-template-areas: "header header header header"
                                 ". body body . "
                                 ". aside1 aside2 ."
                                 "footer footer footer footer";
        }
        .gi{
            background-color: pink;

        }
        .gi1{
            grid-area: header;

        }
        .gi2{
             grid-area: aside1;
            }
        .gi3{
             grid-area: body;
        }
        .gi4{
            grid-area:aside2 ;
        }
        .gi5{
            grid-area: footer;
        }
        
    </style>
</head>
<body>
    <h1>Gtid tmplate ares</h1>
    <div class="gc">
        <div class="gi gi1">Header</div>
        <div class="gi gi2">aside1</div>
        <div class="gi gi3">content</div>
        <div class="gi gi4">aside2</div>
        <div class="gi gi5">Footer</div>
       
    </div>
</body>
</html>
