<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows:auto;
            gap: 10px;
            height: 500px;

        }
        .gi{
            background-color: rosybrown;
            text-align: center;
            place-content: center;
            
        }
        .gi1{
            background-color: aqua;
            grid-column: 1/4;
            grid-row: 1;
            
        }
        .gi2{
            grid-column:1/2;
            grid-row:2;
        }
        .gi3{
            grid-column: 2/4;
            grid-row: 2/4;
        }
        .gi4{
            grid-column:1/2;
            grid-row:3/5;
        }
        .gi5{
            grid-column:2/4;
            grid-row:4;
        }
        .gi6{
            grid-column:1/3;
            grid-row:5;
        }
        .gi7{
            grid-column:3/4;
            grid-row:5;
        }
        .gi8{
            background-color: orangered;
            grid-column:1/4;
            grid-row: 6;
          
        }

    </style>
</head>
<body>
    <h2>CSS Grid layout 4</h2>
    <div class="gc">
        <div class="gi gi1">gi 1</div>
        <div class="gi gi2">gi 2</div>
        <div class="gi gi3">gi 3</div>
        <div class="gi gi4">gi 4</div>
        <div class="gi gi5">gi 5</div>
        <div class="gi gi6">gi 6</div>
        <div class="gi gi7">gi 7</div>
        <div class="gi gi8">gi 8</div>

       
        

    </div>
</body>
</html>
