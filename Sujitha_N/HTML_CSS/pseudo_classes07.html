<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: darkorange;
            border: 1px solid red;
            padding: 10px;
            font-size: 20px;
            border-radius: 10px;
        }
        button:hover{
            background-color: aqua;
           
        }
        button:active{
             /* box-shadow: 5px 5px 5px 5px lightgrey inset; */
             transform: scale(2);
        }
        h1:hover{
            color: blueviolet;
        }
        input{
            border: 2px solid blue;
        }
        input:focus{
            outline: none;
            border: 2px solid red;
           padding: 10px;
            border-radius: 10px;
        }
        a:link{
            text-decoration: none;
            display: inline-block;
            color: red;
            background-color: aqua;
            padding: 10px;
            border: 1px solid red;
            border-radius: 5px;

        }
        a:visited{
            color: rgb(20, 218, 20);
        }
        input:disabled{
            border: 1px solid red;
        }
        input+:checked+label{
            font-size: bold;
            color: greenyellow;
        }

    </style>
</head>
<body>
    <h1>CSS Pseudo classes</h1>
    <form action="/submit">
        <div>
        <label for="fn">first name</label>
        <input type="text" is="fn"/>
        </div>
        <div>
        <label for="fn">middle name</label>
        <input type="text" is="fn"/>
        </div>
        <div>
        <label for="fn">last name</label>
        <input type="text" is="fn"/>
        </div>
        <div>
            <a href="https://www.google.com">Google</a>
        </div>
        <hr>
        <div>
            <h3>Qualification</h3>
             <input type="checkbox" name="q" id="x" />
             <label for="x">10th class</label>
             <input type="checkbox" name="q" id="i" />
             <label for="x">intermediate</label>
             <input type="checkbox" name="q" id="d" />
             <label for="x">degree</label>
             <input type="checkbox" name="q" id="p" />
             <label for="x">post graduate</label>
        </div>
    </form>
    <hr>
    <button>click me</button>
</body>
</html>
