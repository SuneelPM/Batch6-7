<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 3fr;
            gap: 10px;
            height: 500px;
        }
        .gi{
            background-color: black;
            color: bisque;
        }
        .gi1{
            grid-column:1/2 ;
            grid-row:1/2 ;
        }
        .gi2{
            grid-column:1/2;
            grid-row:2/3 ;
        }
    </style>
</head>
<body>
    <div class="gc">
        <div class="gi gi1">gi1</div>
        <div class="gi gi2">gi2</div>
    </div>
</body>
</html>
