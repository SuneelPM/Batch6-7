<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .grand-parent{
            position: relative;
        }
        .parent{
            position: relative;
            height: 500px;
            width: 500px;
            background-color: aqua;
          
        }
        .child{
            height: 100px;
            width: 100px;
        }
        .child-1{
            background-color: pink;
        }
        
        .child-2{
            background-color: palevioletred;
            position:absolute;
            bottom: 100px;
            right: 100px;
        }
        
        .child-3{
            background-color: rgb(221, 43, 168);
            position:absolute;
            top: 0px;
            left: 200px;
        }
        
    </style>
</head>
<body>
  
    <div class="grand-parent">
    <div class="parent">
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
    </div></div>
</body>
</html>
