        //in the list
        function addItem(list, item) {
         if (list.includes(item)) {
           return "Item already in the list";

       //console.log(fruits); // final list

       
       //write a function by using guard clause
       function addItems(list, item) {
        //guard clause
        if (!Array.isArray(list)) {
          return "The given list is not an array";
        }

        //condition
        if (list.includes(item)) {
          return "Item already in the list";
        } else {
          list.push(item);
          return list;
        }
     }
