<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS EVENTS 1</title>
</head>
<body>
    <h1>JS Events day 1</h1>
    <p>How to write an event listerner?</p>
    <button>Click Me</button>

    <script>
        const para = document.querySelector('p');
        const btn = document.querySelector('button');
        function ColorHandler() {
            para.style.color = "blue";
        }

        function addBorder() {
            para.style.border = "3px solid red";
        }


        //wrt eventlistener
        btn.addEventListener("click",ColorHandler());
        btn.addEventListener("click",addBorder());

        //addEventListner using arrow functions
        btn.addEventListener('click',() => {
            para.style.background = "red";
            para.style.padding = "10px";
        });

        //change font size when mouseover
        para.addEventListener('mouseover',() => para.style.fontSize ="30px");
        para.addEventListener('mouseout',() => para.style.fontSize ="16px");

        




    </script>
    
</body>
</html>
