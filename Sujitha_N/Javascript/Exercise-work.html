    <h1>Function Expression</h1>
    <script>
      const sayGoodBye = function () {
        console.log("GoodBye!");
      };
      sayGoodBye();

      const caluclator = function (a, b, operation) {
        if (operation == "+") {
          console.log(a + b);
        } else if (operation == "-") {
          console.log(a - b);
        } else if (operation == "*") {
          console.log(a * b);
        } else if (operation == "/") {
          console.log(a / b);
        } else if (operation == "%") {
          console.log(a % b);
        } else if (operation == "**") {
          console.log(a ** b);
        } else {
          console.log("invalid");
        }
      };
      caluclator(10, 5, "+");

      const greet = function (name) {
        console.log(`Hi ${name},How are you?`);
        console.log("Hi " + name + "," + "How are you?");
      };
      greet("suji");
          greet("sujitha");
    
    
    //Combine slice and splice 
    const source = [1, 2, 3, 4, 5, 6];
    const target = [7, 8];
    
    const lastThree = source.slice(-3); 
    target.splice(0, 0, ...lastThree);
    
    console.log(target); // [4, 5, 6, 7, 8]
    
    
    //Find second occurrence 
    const nums = [1, 2, 3, 2, 4, 2];
    const first = nums.indexOf(2);
    const second = nums.indexOf(2, first + 1);
    
    console.log(second); // 3
    
    //Dynamic deletion 
    function removeItem(arr, item) {
        const index = arr.indexOf(item);
        if (index !== -1) {
            arr.splice(index, 1);
        }
        return arr;
    }
    
    //Safe array palindrome 
    function isPalindrome(arr) {
        const orig = arr.join('');
        // slice() creates copy before reverse
        const rev = arr.slice().reverse().join('');
        return orig === rev;
    }
    
    //The master chain
    const num = new Array(1, 2, 3, 4, 5);
    // slice(1, 4) gets indices 1, 2, 3
    const res = num.slice(1, 4).reverse().join(' -> ');
    console.log(res); // "4 -> 3 -> 2"
    
    
    //Splice to move element 
    const arr1 = [10, 20, 30, 40];
    const idx1 = arr1.indexOf(20);
    if(idx > -1) {
        const item = arr1.splice(idx1, 1)[0];
        arr.splice(arr1.length, 0, item);
    }
    console.log(arr1); // [10, 30, 40, 20]
    
    
    //Insert array into string 
    const main = ['a', 'b', 'c', 'd'];
    const insert = ['x', 'y'];
    main.splice(2, 0, ...insert);
    console.log(main); // ["a", "b", "x", "y", "c", "d"]
    
    
    //Replace all occurance 
    const words = ['bad', 'ok', 'bad'];
    let idx = words.indexOf('bad');
    while (idx !== -1) {
        words.splice(idx, 1, 'good');
        idx = words.indexOf('bad', idx + 1);
    }
    console.log(words); // ["good", "ok", "good"]
    
    //Split,reverse,join
    const str1 = "hello";
    // Spread syntax converts iterable to array
    const arr2 = [...str1]; 
    const reversedStr = arr2.reverse().join('');
    console.log(reversedStr); // "olleh"
    
    
    //Slice to excludeends
    function trimEnds(arr) {
        if (arr.length <= 2) return [];
        return arr.slice(1, -1);
    }
    console.log(trimEnds([1, 2, 3, 4])); // [2, 3]
    
    //Splice return values 
    const arr3  = ['a', 'b', 'c'];
    const deleted = arr3.splice(1, 1); 
    console.log(deleted); // ["b"]
    
    //Strictly Boolean includes 
    const arr4 = [1, 2, 3]; 
    console.log(arr4.includes(2)); //
    
    
    //Swap two elements 
    const arr5 = [10, 50, 30];
    const i1 = arr5.indexOf(50);
    const i2 = arr5.indexOf(30);
    const val1 = arr.splice(i1, 1)[0]; 
    arr.splice(i1, 0, 30);
    arr.splice(i2, 1);
    arr.splice(i2, 0, val1);
    console.log(arr5); // [10, 30, 50]
    
    
    //Negative splice index
    const arr6 = [1, 2, 99];
    arr.splice(-1, 1, 3);
    console.log(arr6);
    
   
    //Creating a range 
    const emptyArr = new Array(4);
    const str = emptyArr.join(',');
    console.log(str); // ",,,"
    
    //Array constructor map
    const A = new Array(3); 
    console.log(A); // [empty × 3]
    const B = new Array('3');
    console.log(B); // ["3"]
    
    
    //Splice injection 
    const a = [1, 2, 5, 6];
    const b = [3, 4];
    A.splice(2, 0, ...b);
    console.log(a); // [1, 2, 3, 4, 5, 6]
    
    
    //Custom join implementation 
    function customJoin(arr, sep = ',') {
        if (arr.length === 0) return "";
        let result = String(arr[0] ?? "");
        for (let i = 1; i < arr.length; i++) {
            result += sep + String(arr[i] ?? "");
        }
        return result;
    }
    console.log(customJoin([1, null, 3], '-')); // "1--3"
    
    
    //Multi dimensional slice
    const matrix = [[1, 2], [3, 4], [5, 6]];
    const shallow = matrix.slice(0, 1); // Returns [[1, 2]]
    shallow[0][0] = 99;
    console.log(matrix[0][0]); // 99
    
    
    
    //Removing duplicates (indexof)
    function unique(arr) {
        const result = [];
        for (let i = 0; i < arr.length; i++) {
            if (result.indexOf(arr[i]) === -1) {
                result.push(arr[i]);
            }
        }
        return result;
    }
    console.log(unique([1, 2, 2, 3, 1])); // [1, 2, 3]
    
    
    //Circular shift right
    const arr7 = [1, 2, 3, 4];
    const lastItem = arr7.splice(-1, 1)[0];
    arr.splice(0, 0, lastItem);
    console.log(arr7); // [4, 1, 2, 3]
    
    
    
    //Nan detection (indexof vs includes)
    const arr = [1, NaN, 3];
    console.log(arr.indexOf(NaN)); // -1
    console.log(arr.includes(NaN)); // true
    
    
    
    //Inter leveling arrays 
    const x = ['a', 'c', 'e'];
    const y = ['b', 'd'];
    let insertPos = 1;
    for (let i = 0; i < y.length; i++) {
        x.splice(insertPos, 0, y[i]);
        insertPos += 2; // Move 2 spaces forward to interleave
    }
    console.log(x); // ["a", "b", "c", "d", "e"]
    
    
    //Extracting and joining domains 
    const urls = ['http://google.com', 'https://bing.com'];
    const domains = [];
    
    for (let url of urls) {
        const slashIdx = url.indexOf('//');
        if (slashIdx !== -1) {
            domains.push(url.slice(slashIdx + 2)); 
        }
    }
    console.log(domains.join(', ')); // "google.com, bing.com"
