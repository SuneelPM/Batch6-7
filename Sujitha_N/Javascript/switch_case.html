<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Switch case</title>
</head>
<body>
    <script>
        let num = Number(prompt("enter a number 1 and 7"))
        console.log("user entered a number:, num")
        switch(num) {
            case 1:
                console.log("sunday");
                break;
            case 2:
                console.log("Monday");
                break;
            case 3:
                console.log("Tuesday");
                break; 
            case 4:
                console.log("Wednesday");
                break; 
            case 5:
                console.log("Thursday");
                break;  
            case 6:
                console.log("Friday");
                break; 
            case 7:
                console.log("saturday");
                break; 
            default:
                console.log("plz enter a number between 1 and 7")                      
        }

        
        //second way to write switch case
        let marks = Number(prompt("enter marks"));
        switch(true) {
            case (marks >= 90 && marks <=100):
                console.log("Grade A");
                break;
            case (marks >= 90 && marks <=80):
                console.log("Grade B");
                break; 
            case (marks >=80 && marks <=70):
                console.log("Grade c") ;
                break;
            case (marks >= 40 && marks < 70):
                console.log("Grade D");
                break;
            case (marks >= 0 && marks < 40):
                console.log("Grade E");
                break;

            default:
                console.log("Fail") ;
            

        }
    </script>
    
</body>
</html>
