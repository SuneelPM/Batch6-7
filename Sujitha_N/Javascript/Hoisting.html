<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Hoisting</title>
</head>
<body>
    <script>
        //variables or functions will be lifted up
        //so they will be available throught out thefile
        //var variables
        
        console.log(a);
        a = 20;
        console.log(a); // a is undefined
        var a =10;
        console.log(a); //a is 10
        
        //console.log(b)
        let b =20;
        console.log(b);

        //console.log(c)
        let c =30;
        console.log(c);
        

        console.log("value before function definition:",greet())
        function greet() {
            return "Hello";
        }
        console.log("value after function definition:",greet())

        console.log(sum(12, 13));
        let sum = function (num1,num2) {
            return num1 + num2
        };
        console.log(sum(12, 13));
        
        //nfactorial
        const nFactorial = function fact(n) {
            if (n == 2) {
                return 2;
            }
            return n * fact(n - 1);

        };
        nFactorial(-1);


        //guard clause
        const fact = function(n) {
         if (n < 0) {
             return "Invalid input";
         }
     
         if (n === 0 || n === 1) {
             return 1;
         }
     
         return n * fact(n - 1);
         };
         
         console.log(nFactorial(n - 1))
    </script>

    
</body>
</html>
