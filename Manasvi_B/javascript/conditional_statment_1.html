<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>
<body>
    <h1>JS Conditional Statements</h1>
    <script>
        let age = Number(prompt("Enter age: "))
        //if
        if(age > 0){
            console.log("You are alive")
        }
        //if-else
        if(age >= 18){
            console.log("You are eligible to vote")
        }
        else{
            console.log("You are not eligible to vote")
        }
        //if else if else
        if(age >= 21){
            console.log("You can buy cigrattes and alcohol")
        }
        else if(age < 21 && age >= 18){
            console.log("You can buy only cigrattes")
        }
        else{
            console.log("You cannot buy anything")
        }
        // multiple statments
        let marks = Number(prompt("Enter marks: "))
        if(marks <= 100 && marks >= 90){
            console.log("Grade-A")
        }
        else if(marks >= 80 && marks <= 89){
            console.log("Grade-B")
        }
        else if(marks >= 70 && marks <= 79){
            console.log("Grade-C")
        }
        else if(marks >= 40 && marks <= 69){
            console.log("Grade-D")
        }
        else{
            console.log("Fail")
        }
    </script>
</body>
</html>
