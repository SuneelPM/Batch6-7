<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <style>
      .title { fill: #22d3ee; font-size: 16px; font-weight: bold; font-family: Inter, sans-serif; }
      .box { stroke-width: 2; rx: 4; }
      .folder { fill: #334155; }
      .text { fill: #f8fafc; font-size: 12px; font-family: Inter, sans-serif; }
      .label { fill: #94a3b8; font-size: 10px; font-family: Inter, sans-serif; }
      .line { stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="title">The .git Directory Structure</text>

  <!-- Root folder -->
  <rect x="220" y="40" width="160" height="40" fill="#1e293b" stroke="#22d3ee" class="box"/>
  <text x="300" y="67" text-anchor="middle" class="text" font-size="14" font-weight="bold">.git/</text>

  <!-- Level 2 items -->
  <rect x="30" y="110" width="100" height="35" class="folder" stroke="#fb923c" class="box"/>
  <text x="80" y="132" text-anchor="middle" class="text">HEAD</text>

  <rect x="150" y="110" width="100" height="35" class="folder" stroke="#fb923c" class="box"/>
  <text x="200" y="132" text-anchor="middle" class="text">config</text>

  <rect x="270" y="110" width="100" height="35" class="folder" stroke="#94a3b8" class="box"/>
  <text x="320" y="132" text-anchor="middle" class="text">description</text>

  <rect x="390" y="110" width="100" height="35" class="folder" stroke="#4ade80" class="box"/>
  <text x="440" y="132" text-anchor="middle" class="text">index</text>

  <rect x="510" y="110" width="70" height="35" class="folder" stroke="#94a3b8" class="box"/>
  <text x="545" y="132" text-anchor="middle" class="text">logs</text>

  <!-- Level 3 - Folders -->
  <rect x="30" y="180" width="120" height="35" class="folder" stroke="#94a3b8" class="box"/>
  <text x="90" y="202" text-anchor="middle" class="text">hooks/</text>

  <rect x="170" y="180" width="120" height="35" class="folder" stroke="#94a3b8" class="box"/>
  <text x="230" y="202" text-anchor="middle" class="text">info/</text>

  <rect x="310" y="180" width="120" height="35" class="folder" stroke="#f87171" class="box"/>
  <text x="370" y="202" text-anchor="middle" class="text">objects/</text>

  <rect x="450" y="180" width="120" height="35" class="folder" stroke="#4ade80" class="box"/>
  <text x="510" y="202" text-anchor="middle" class="text">refs/</text>

  <!-- Connection lines from root -->
  <line x1="300" y1="80" x2="300" y2="90" class="line"/>
  <line x1="80" y1="90" x2="545" y2="90" class="line"/>
  <line x1="80" y1="90" x2="80" y2="110" class="line"/>
  <line x1="200" y1="90" x2="200" y2="110" class="line"/>
  <line x1="320" y1="90" x2="320" y2="110" class="line"/>
  <line x1="440" y1="90" x2="440" y2="110" class="line"/>
  <line x1="545" y1="90" x2="545" y2="110" class="line"/>

  <!-- Connection lines to folders -->
  <line x1="90" y1="145" x2="90" y2="160" class="line"/>
  <line x1="230" y1="145" x2="230" y2="160" class="line"/>
  <line x1="370" y1="145" x2="370" y2="160" class="line"/>
  <line x1="510" y1="145" x2="510" y2="160" class="line"/>

  <!-- Labels -->
  <text x="90" y="240" text-anchor="middle" class="label">Client-side scripts</text>
  <text x="230" y="240" text-anchor="middle" class="label">Exclude patterns</text>
  <text x="370" y="240" text-anchor="middle" class="label" fill="#f87171">All file content (blobs)</text>
  <text x="510" y="240" text-anchor="middle" class="label" fill="#4ade80">Branch pointers</text>

  <!-- Legend -->
  <rect x="50" y="270" width="500" height="70" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="300" y="290" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold" font-family="Inter, sans-serif">Key Files</text>

  <rect x="70" y="305" width="12" height="12" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <text x="90" y="315" fill="#cbd5e1" font-size="10" font-family="Inter, sans-serif">Current branch pointer</text>

  <rect x="220" y="305" width="12" height="12" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="240" y="315" fill="#cbd5e1" font-size="10" font-family="Inter, sans-serif">Staging area (index)</text>

  <rect x="370" y="305" width="12" height="12" fill="#334155" stroke="#f87171" stroke-width="2"/>
  <text x="390" y="315" fill="#cbd5e1" font-size="10" font-family="Inter, sans-serif">Object database (your code)</text>

  <rect x="70" y="325" width="12" height="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="335" fill="#cbd5e1" font-size="10" font-family="Inter, sans-serif">Configuration/settings</text>
</svg>