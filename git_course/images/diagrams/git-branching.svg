<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { fill: #22d3ee; font-size: 18px; font-weight: bold; font-family: Inter, sans-serif; }
      .branch-label { fill: #f8fafc; font-size: 12px; font-weight: bold; font-family: Inter, sans-serif; }
      .commit-text { fill: #f8fafc; font-size: 10px; font-family: Inter, sans-serif; }
      .label { fill: #94a3b8; font-size: 11px; font-family: Inter, sans-serif; }
      .main-branch { fill: #4ade80; }
      .feature-branch { fill: #22d3ee; }
      .merge-commit { fill: #fb923c; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Git Branching &amp; Merging</text>

  <!-- Main branch (green) -->
  <rect x="50" y="80" width="600" height="50" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="8"/>
  <text x="80" y="110" class="branch-label" fill="#4ade80">main branch</text>

  <!-- Commits on main -->
  <circle cx="150" cy="105" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="150" y="109" text-anchor="middle" class="commit-text">C1</text>

  <circle cx="250" cy="105" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="250" y="109" text-anchor="middle" class="commit-text">C2</text>

  <line x1="170" y1="105" x2="230" y2="105" stroke="#4ade80" stroke-width="3"/>
  <polygon points="230,105 220,100 220,110" fill="#4ade80"/>

  <!-- Branch point -->
  <circle cx="350" cy="105" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="350" y="109" text-anchor="middle" class="commit-text">C3</text>

  <line x1="270" y1="105" x2="330" y2="105" stroke="#4ade80" stroke-width="3"/>
  <polygon points="330,105 320,100 320,110" fill="#4ade80"/>

  <!-- Main continues -->
  <circle cx="550" cy="105" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="550" y="109" text-anchor="middle" class="commit-text">C5</text>

  <line x1="370" y1="105" x2="530" y2="105" stroke="#4ade80" stroke-width="3"/>
  <polygon points="530,105 520,100 520,110" fill="#4ade80"/>

  <!-- Merge commit -->
  <circle cx="650" cy="105" r="20" fill="#fb923c" stroke="#fb923c" stroke-width="3"/>
  <text x="650" y="109" text-anchor="middle" class="commit-text" font-weight="bold">C6</text>

  <line x1="570" y1="105" x2="630" y2="105" stroke="#4ade80" stroke-width="3"/>
  <polygon points="630,105 620,100 620,110" fill="#4ade80"/>

  <!-- Feature branch (cyan) -->
  <rect x="320" y="180" width="200" height="50" fill="#1e293b" stroke="#22d3ee" stroke-width="2" rx="8"/>
  <text x="340" y="210" class="branch-label" fill="#22d3ee">feature branch</text>

  <circle cx="400" cy="205" r="20" fill="#334155" stroke="#22d3ee" stroke-width="2"/>
  <text x="400" y="209" text-anchor="middle" class="commit-text">C4</text>

  <!-- Branch connector -->
  <line x1="350" y1="125" x2="350" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="350" y1="150" x2="400" y2="185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="400,185 390,180 392,190" fill="#94a3b8"/>

  <!-- Merge connector -->
  <line x1="400" y1="225" x2="400" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="250" x2="640" y2="125" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="640,125 630,125 635,135" fill="#94a3b8"/>

  <!-- Command annotations -->
  <rect x="50" y="300" width="220" height="80" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
  <text x="60" y="320" fill="#22d3ee" font-size="12" font-weight="bold" font-family="Inter, sans-serif">Creating a branch:</text>
  <text x="60" y="340" fill="#f8fafc" font-size="11" font-family="'JetBrains Mono', monospace">git branch feature</text>
  <text x="60" y="355" fill="#f8fafc" font-size="11" font-family="'JetBrains Mono', monospace">git switch feature</text>
  <text x="60" y="370" fill="#94a3b8" font-size="10" font-family="Inter, sans-serif">or: git switch -c feature</text>

  <rect x="290" y="300" width="220" height="80" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
  <text x="300" y="320" fill="#fb923c" font-size="12" font-weight="bold" font-family="Inter, sans-serif">Merging:</text>
  <text x="300" y="340" fill="#f8fafc" font-size="11" font-family="'JetBrains Mono', monospace">git switch main</text>
  <text x="300" y="355" fill="#f8fafc" font-size="11" font-family="'JetBrains Mono', monospace">git merge feature</text>
  <text x="300" y="370" fill="#94a3b8" font-size="10" font-family="Inter, sans-serif">Combines branches</text>

  <rect x="530" y="300" width="240" height="80" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
  <text x="540" y="320" fill="#f87171" font-size="12" font-weight="bold" font-family="Inter, sans-serif">Deleting branch:</text>
  <text x="540" y="340" fill="#f8fafc" font-size="11" font-family="'JetBrains Mono', monospace">git branch -d feature</text>
  <text x="540" y="360" fill="#94a3b8" font-size="10" font-family="Inter, sans-serif">Safe: only deletes if merged</text>
  <text x="540" y="375" fill="#94a3b8" font-size="10" font-family="Inter, sans-serif">Use -D to force delete</text>
</svg>