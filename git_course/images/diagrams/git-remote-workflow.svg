<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { fill: #22d3ee; font-size: 18px; font-weight: bold; font-family: Inter, sans-serif; }
      .subtitle { fill: #94a3b8; font-size: 12px; font-family: Inter, sans-serif; }
      .box { fill: #1e293b; stroke-width: 2; rx: 8; }
      .text { fill: #f8fafc; font-size: 13px; font-family: Inter, sans-serif; }
      .label { fill: #94a3b8; font-size: 11px; font-family: Inter, sans-serif; }
      .arrow { fill: none; stroke-width: 2; marker-end: url(#arrowhead); }
      .push { stroke: #4ade80; }
      .pull { stroke: #22d3ee; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arrowhead-pull" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Local &amp; Remote Repository Workflow</text>
  <text x="400" y="50" text-anchor="middle" class="subtitle">How code flows between your machine and GitHub</text>

  <!-- Remote Repository (GitHub) -->
  <rect x="250" y="70" width="300" height="100" class="box" stroke="#22d3ee" stroke-width="3"/>
  <rect x="250" y="70" width="300" height="35" fill="#22d3ee" stroke="#22d3ee" stroke-width="3" rx="8"/>
  <rect x="250" y="98" width="300" height="7" fill="#22d3ee"/>
  <text x="400" y="93" text-anchor="middle" class="text" font-weight="bold">Remote Repository (GitHub/GitLab)</text>

  <!-- Remote commits -->
  <circle cx="320" cy="130" r="20" fill="#334155" stroke="#22d3ee" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" class="label">C1</text>

  <circle cx="380" cy="130" r="20" fill="#334155" stroke="#22d3ee" stroke-width="2"/>
  <text x="380" y="135" text-anchor="middle" class="label">C2</text>

  <circle cx="440" cy="130" r="20" fill="#22d3ee" stroke="#22d3ee" stroke-width="3"/>
  <text x="440" y="135" text-anchor="middle" class="text" font-weight="bold">C3</text>

  <circle cx="500" cy="130" r="20" fill="#334155" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="500" y="135" text-anchor="middle" class="label">...</text>

  <line x1="340" y1="130" x2="360" y2="130" stroke="#22d3ee" stroke-width="2"/>
  <line x1="400" y1="130" x2="420" y2="130" stroke="#22d3ee" stroke-width="2"/>
  <line x1="460" y1="130" x2="480" y2="130" stroke="#22d3ee" stroke-width="2"/>

  <!-- Origin label -->
  <text x="270" y="160" class="label" font-style="italic">nickname: "origin"</text>

  <!-- Local Repository -->
  <rect x="50" y="280" width="300" height="100" class="box" stroke="#4ade80" stroke-width="3"/>
  <rect x="50" y="280" width="300" height="35" fill="#4ade80" stroke="#4ade80" stroke-width="3" rx="8"/>
  <rect x="50" y="308" width="300" height="7" fill="#4ade80"/>
  <text x="200" y="303" text-anchor="middle" class="text" font-weight="bold">Your Local Repository</text>

  <!-- Local commits -->
  <circle cx="120" cy="340" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="120" y="345" text-anchor="middle" class="label">C1</text>

  <circle cx="180" cy="340" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="180" y="345" text-anchor="middle" class="label">C2</text>

  <circle cx="240" cy="340" r="20" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="240" y="345" text-anchor="middle" class="label">C3</text>

  <circle cx="300" cy="340" r="20" fill="#4ade80" stroke="#4ade80" stroke-width="3"/>
  <text x="300" y="345" text-anchor="middle" class="text" font-weight="bold">C4</text>

  <line x1="140" y1="340" x2="160" y2="340" stroke="#4ade80" stroke-width="2"/>
  <line x1="200" y1="340" x2="220" y2="340" stroke="#4ade80" stroke-width="2"/>
  <line x1="260" y1="340" x2="280" y2="340" stroke="#4ade80" stroke-width="2"/>

  <!-- Another developer -->
  <rect x="450" y="280" width="300" height="100" class="box" stroke="#fb923c" stroke-width="3"/>
  <rect x="450" y="280" width="300" height="35" fill="#fb923c" stroke="#fb923c" stroke-width="3" rx="8"/>
  <rect x="450" y="308" width="300" height="7" fill="#fb923c"/>
  <text x="600" y="303" text-anchor="middle" class="text" font-weight="bold">Teammate's Local Repo</text>

  <circle cx="520" cy="340" r="20" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <text x="520" y="345" text-anchor="middle" class="label">C1</text>

  <circle cx="580" cy="340" r="20" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <text x="580" y="345" text-anchor="middle" class="label">C2</text>

  <circle cx="640" cy="340" r="20" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <text x="640" y="345" text-anchor="middle" class="label">C3</text>

  <circle cx="700" cy="340" r="20" fill="#fb923c" stroke="#fb923c" stroke-width="3"/>
  <text x="700" y="345" text-anchor="middle" class="text" font-weight="bold">C5</text>

  <line x1="540" y1="340" x2="560" y2="340" stroke="#fb923c" stroke-width="2"/>
  <line x1="600" y1="340" x2="620" y2="340" stroke="#fb923c" stroke-width="2"/>
  <line x1="660" y1="340" x2="680" y2="340" stroke="#fb923c" stroke-width="2"/>

  <!-- Arrows between remote and local -->
  <!-- Push arrow -->
  <path d="M 300 250 Q 350 200 380 180" class="arrow push" marker-end="url(#arrowhead)"/>
  <text x="320" y="210" fill="#4ade80" font-size="12" font-weight="bold" font-family="Inter, sans-serif">git push</text>

  <!-- Pull arrow -->
  <path d="M 350 180 Q 320 200 270 250" class="arrow pull" marker-end="url(#arrowhead-pull)"/>
  <text x="220" y="210" fill="#22d3ee" font-size="12" font-weight="bold" font-family="Inter, sans-serif">git pull/fetch</text>

  <!-- Clone arrow -->
  <path d="M 450 230 Q 420 200 400 180" class="arrow pull" marker-end="url(#arrowhead-pull)"/>
  <text x="460" y="200" fill="#22d3ee" font-size="11" font-weight="bold" font-family="Inter, sans-serif">git clone</text>

  <!-- Legend -->
  <rect x="50" y="400" width="700" height="40" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="400" y="425" text-anchor="middle" class="label">Each developer has a complete copy of the entire repository history</text>
</svg>