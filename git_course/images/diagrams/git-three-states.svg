<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs>
    <style>
      .title { fill: #22d3ee; font-size: 18px; font-weight: bold; font-family: Inter, sans-serif; }
      .subtitle { fill: #94a3b8; font-size: 12px; font-family: Inter, sans-serif; }
      .box { stroke-width: 2; rx: 8; }
      .box-fill { fill: #1e293b; }
      .text { fill: #f8fafc; font-size: 14px; font-family: Inter, sans-serif; }
      .label { fill: #cbd5e1; font-size: 11px; font-family: Inter, sans-serif; }
      .arrow { stroke: #22d3ee; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { fill: #4ade80; font-size: 12px; font-weight: bold; font-family: Inter, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">The Three States of Git</text>
  <text x="350" y="50" text-anchor="middle" class="subtitle">How files move through Git's workflow</text>

  <!-- Working Directory -->
  <rect x="50" y="80" width="180" height="140" fill="#1e293b" stroke="#f87171" stroke-width="3" rx="8"/>
  <rect x="50" y="80" width="180" height="35" fill="#f87171" stroke="#f87171" stroke-width="3" rx="8"/>
  <rect x="50" y="108" width="180" height="7" fill="#f87171"/>
  <text x="140" y="105" text-anchor="middle" class="text" font-weight="bold">Working Directory</text>

  <!-- Files in working directory -->
  <rect x="70" y="125" width="140" height="25" fill="#334155" rx="4"/>
  <text x="140" y="142" text-anchor="middle" class="label">modified file.txt</text>

  <rect x="70" y="155" width="140" height="25" fill="#334155" rx="4"/>
  <text x="140" y="172" text-anchor="middle" class="label">new file.html</text>

  <rect x="70" y="185" width="140" height="25" fill="#334155" rx="4"/>
  <text x="140" y="202" text-anchor="middle" class="label">deleted old.css</text>

  <!-- Staging Area -->
  <rect x="260" y="80" width="180" height="140" fill="#1e293b" stroke="#fb923c" stroke-width="3" rx="8"/>
  <rect x="260" y="80" width="180" height="35" fill="#fb923c" stroke="#fb923c" stroke-width="3" rx="8"/>
  <rect x="260" y="108" width="180" height="7" fill="#fb923c"/>
  <text x="350" y="105" text-anchor="middle" class="text" font-weight="bold">Staging Area (Index)</text>

  <!-- Files in staging -->
  <rect x="280" y="140" width="140" height="25" fill="#334155" rx="4"/>
  <text x="350" y="157" text-anchor="middle" class="label">file.txt ✓</text>

  <rect x="280" y="175" width="140" height="25" fill="#334155" rx="4"/>
  <text x="350" y="192" text-anchor="middle" class="label">file.html ✓</text>

  <!-- Repository -->
  <rect x="470" y="80" width="180" height="140" fill="#1e293b" stroke="#4ade80" stroke-width="3" rx="8"/>
  <rect x="470" y="80" width="180" height="35" fill="#4ade80" stroke="#4ade80" stroke-width="3" rx="8"/>
  <rect x="470" y="108" width="180" height="7" fill="#4ade80"/>
  <text x="560" y="105" text-anchor="middle" class="text" font-weight="bold">Repository (.git)</text>

  <!-- Commits in repo -->
  <circle cx="515" cy="165" r="25" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="515" y="170" text-anchor="middle" class="label">abc12</text>

  <circle cx="560" cy="150" r="25" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <text x="560" y="155" text-anchor="middle" class="label">def34</text>

  <circle cx="605" cy="165" r="25" fill="#22d3ee" stroke="#22d3ee" stroke-width="2"/>
  <text x="605" y="170" text-anchor="middle" class="text" font-weight="bold">NEW</text>

  <!-- Arrows -->
  <path d="M 230 140 L 260 150" class="arrow"/>
  <path d="M 230 170 L 260 165" class="arrow"/>
  <path d="M 440 165 L 470 165" class="arrow"/>

  <!-- Arrow Labels -->
  <text x="245" y="135" text-anchor="middle" class="arrow-label">git add</text>
  <text x="455" y="155" text-anchor="middle" class="arrow-label">git commit</text>

  <!-- Bottom descriptions -->
  <text x="140" y="245" text-anchor="middle" class="label" fill="#f87171">Where you edit files</text>
  <text x="350" y="245" text-anchor="middle" class="label" fill="#fb923c">Prepare for commit</text>
  <text x="560" y="245" text-anchor="middle" class="label" fill="#4ade80">Permanent snapshot</text>

  <!-- Legend box -->
  <rect x="100" y="265" width="500" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="350" y="284" text-anchor="middle" class="label">Workflow: Edit files → Stage changes → Commit to history</text>
</svg>