//Safe array palindrome 
function isPalindrome(arr) {
    const orig = arr.join('');
    // slice() creates copy before reverse
    const rev = arr.slice().reverse().join('');
    return orig === rev;

//Custom join implementation 
function customJoin(arr, sep = ',') {
    if (arr.length === 0) return "";
    let result = String(arr[0] ?? "");
    for (let i = 1; i < arr.length; i++) {
        result += sep + String(arr[i] ?? "");
    }
    return result;
}
console.log(customJoin([1, null, 3], '-')); // "1--3"

//Removing duplicates (indexof)
function unique(arr) {
    const result = [];
    for (let i = 0; i < arr.length; i++) {
        if (result.indexOf(arr[i]) === -1) {
            result.push(arr[i]);
        }
    }
    return result;
}
console.log(unique([1, 2, 2, 3, 1])); // [1, 2, 3]

//Inter leveling arrays 
const A = ['a', 'c', 'e'];
const B = ['b', 'd'];

// Iterate backwards or carefully manage indices
let insertPos = 1;
for (let i = 0; i < B.length; i++) {
    A.splice(insertPos, 0, B[i]);
    insertPos += 2; // Move 2 spaces forward to interleave
}
console.log(A); // ["a", "b", "c", "d", "e"]

//Extracting and joining domains 
const urls = ['http://google.com', 'https://bing.com'];
const domains = [];

for (let url of urls) {
    const slashIdx = url.indexOf('//');
    if (slashIdx !== -1) {
        // String slice, not array slice, but similar concept
        domains.push(url.slice(slashIdx + 2)); 
    }
}
console.log(domains.join(', ')); // "google.com, bing.com"
