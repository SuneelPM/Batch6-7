<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
    <style>
        body{
            background-color: rgb(29, 148, 108);
        }
    </style>
</head>
<body>
    <h1>JS conditional statements</h1>
    <script>
        let age = Number(prompt("Enter your age"));

        //if
        if(age > 0) {
            console.log("You are alive ")
        }
        //if else
        if(age >=18) {
            console.log("You are eligible to vote");
        } else {
             console.log("You are not eligible to vote");
        }

        //if else if else

        if (age >= 21){
            console.log("You are eligible to but both tobacco and alcohol");
        } else if (age < 21 && age >= 18) {
            console.log("You are eligible to buy only tobaco but not alcohol");
        } else {
            console.log("You are not eligible to buy either tobacco or alcohol");
        }


        //grade A - 90 - 100
        //grade B - 80 - 90
        //grade C - 70 - 80
        //grade D - 40 - 70
        //grade F - 0 - 40
        let marks = Number(prompt("Enter your marks:"));

        if (marks >= 90 && marks <= 100) {
            console.log("Grade A");
        } else if (marks >= 80 && marks < 90) {
            console.log("Grade B");
        } else if (marks >= 70 && marks < 80) {
  console.log("Grade C");
} else if (marks >= 40 && marks < 70) {
            console.log("Grade D");
        } else if (marks >= 0 && marks < 40) {
            console.log("Grade F");
        } else {
            console.log("Invalid marks");
        }

        //a student is preparing for UPSC exam,we need to find the eligibility of the student based on
        //category and age -> no.of attempts
        
        //min age:21 years.
        //GENERAL/EWS:32 years(6 attempts).
        //OBC (non-creamy layer): 35 years(9 attempts)
        //SC/ST: 37 years (unlimited attempts).
        //persons with Benchmark disablities (PWBD): 42 years. 
    </script>
</body>
</html>
