<!DOCTYPE html>
<html>
    <head>
        <title>Box Model</title>
        <style>
            p{
                /* box-sizing: content-box; */
                box-sizing: border-box;
                width: 500px;
                padding: 10px;
                margin: 20px;
                border: 5px solid;
            }
            button {
                box-sizing: border-box;
                width: 200px;
                height: 5%;
                padding: 10px;
                border: 1px solid rgb(9, 0, 128);
                background-color: blanchedalmond;
                border-radius: 10px;


            }
        </style>
    </head>
    <body>
        <h2>Box Model</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat tenetur quos quibusdam
           possimus eum fugit maiores! Nisi, voluptate.
           Nostrum tempore in obcaecati iure magni voluptas nemo consequuntur doloribus fugiat illo!</p>
        <button>click</button>
    </body>
</html>
