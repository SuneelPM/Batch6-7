<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns:auto repeat(3, 1fr) 200px; /* repeate(3,200px) */
            grid-template-rows:  auto 100px ;
            row-gap: 10px;
            column-gap: 20px;
            /* height: 500px; */
        }
        .grid-items{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>CSS Grid</h1>
    <div class="grid-container">
    <div class="grid-items grid-item-1">grid-item-1</div>
    <div class="grid-items grid-item-2">grid-item-2</div>
    <div class="grid-items grid-item-3">grid-item-3</div>
    <div class="grid-items grid-item-4">grid-item-4</div>
    <div class="grid-items grid-item-5">grid-item-5</div>
    <div class="grid-items grid-item-6">grid-item-6</div>
    </div>

</body>
</html>
