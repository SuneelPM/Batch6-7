<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GRID EX 4</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: repeat(8,1fr);
            grid-template-rows: repeat(8,1fr);
            gap: 10px;
            height: 400px;
            /* background-color: blueviolet; */
            
        }
        .gi{
            background-color: rgb(212, 148, 208);
            /* background-image: url(images/nature.jpg); */
            /* text-align: center; */
            place-content: center;
            /* border: 5px solid white; */
        }
        .gi1{
        grid-column: 1 /4;
        grid-row: 1 /2;
        background-color: aqua;
        text-align: center;
        place-content: center;
        height: 50px;
        width: 700px;
        }
        .gi2{
            grid-column: 1 /2;
        grid-row: 2 /5;
        background-color: violet;
        text-align: center;
        place-content: center;

        }
        .gi3{
            grid-column: 2 /4;
        grid-row: 2 /7;
        background-color: yellow;
         text-align: center;
        place-content: center;
        }
        .gi4{
            grid-column: 1 /2;
        grid-row: 5 /9;
        background-color: yellowgreen;
         text-align: center;
        place-content: center;
        }
        .gi5{
            grid-column: 2 /4;
        grid-row: 7 /9;
        background-color: gray;
         text-align: center;
        place-content: center;
        }
        .gi6{
            grid-column: 1 /3;
        grid-row: 9 /11;
        background-color: green;
         text-align: center;
        place-content: center;
        height: 50px;
        }
        .gi7{
            grid-column: 3 /4;
        grid-row: 9 /11;
        background-color: pink;
         text-align: center;
        place-content: center;
        height: 50px;
        }
        .gi8{
            grid-column: 1 /4;
        grid-row: 11 /12;
        background-color: orange;
         text-align: center;
        place-content: center;
        height: 50px;
        }
    </style>
</head>
<body>
    <div class="gc">
        <gi class="gi gi1">Header</gi>
        <gi class="gi gi2">Hero</gi>
        <gi class="gi gi3">Item3</gi>
        <gi class="gi gi4">Item4</gi>
        <gi class="gi gi5">Item5</gi>
        <gi class="gi gi6">Item6</gi>
        <gi class="gi gi7">Item7</gi>
        <gi class="gi gi8">Item8</gi>
    </div>
</body>
</html>
