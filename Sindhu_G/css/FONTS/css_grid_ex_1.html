<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Example</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 100px  100px 1fr;
            grid-template-rows: 100%;
            gap: 10px;
            height: 100vh;
            place-content: center;
            text-align: center;
        }
        .grid-items{
            background-color: blueviolet;
        }
      


    
    </style>
</head>
<body>
    <div class="grid-container">
    <div class="grid-items grid-items-1">Inbox</div>
    <div class="grid-items grid-items-2">Message List</div>
    <div class="grid-items grid-items-3">Messages</div>
    </div>
</body>
</html>
