<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling Example</title>

    <style>
        /* Style for div */
        div {
            color: black;
            background-color:gold;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid black ;
            box-shadow: 5px 5px rgb(147, 59, 59);
            width: 300px;
        }

        /* Style for ordered list */
        ol {
            color: red;background-color: rgb(221, 243, 236);
            padding: 10px;
        }

        /* Style for unordered list */
        ul {
            color: darkgreen;
            background-color: #e6ffe6;
            padding: 10px;
            list-style-type: square;
        }

        /* Style for table */
        table {
            border-collapse: collapse;
            width: 300px;
        }

        table, th, td {
            border: 1px solid black;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: rgb(133, 34, 34);
            color: white;
        }

        /* Style for input */
        input {
            padding: 5px;
            margin: 5px;
            border: 2px solid purple;
            border-radius: 5px;
        }

        input:focus {
            background-color: #f0e6ff;
        }
        body{
            background-color: pink;
        }
    </style>

</head>
<body>

    <div>
        <h3>Student Details</h3>
        Name: <input type="text"><br>
        Email: <input type="email">
    </div>

    <ol>
        <li><p>HTML</p></li>
        <li><p>CSS</p></li>
        <li><p>JS</p></li>
            
              
    </ol>

    <ul>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>ORACLE</li>
    </ul>

    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Sindhu</td>
            <td>95</td>
        </tr>
        <tr>
            <td>Agarwal</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
