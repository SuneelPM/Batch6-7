<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex shorthand property</title>
    <style>
        .flex-container{
            display: flex;
            gap: 10px;
            background-color: antiquewhite;
            padding: 30px;
        }
        .flex-items{
            background-color: coral;
            color: blue;
            width: 100px;
            height: 100px;
            text-align: center;
            place-content: center;
            flex: 200px;
        }
    </style>
</head>
<body>
   <h1>CSS flex shorthand property</h1> 
   <div class="flex-container">
    <div class="flex-items flex-item-1">flex-Item-1</div>
    <div class="flex-items flex-item-2">flex-Item-2</div>
    <div class="flex-items flex-item-3">flex-Item-3</div>
</body>
</html>
