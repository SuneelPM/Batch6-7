<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration Form</title>
</head>
<body>

<h2>Patient Registration</h2>

<form>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age"><br><br>

    <label>Gender:</label>
    <input type="radio" id="male" name="gender">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender">
    <label for="female">Female</label><br><br>

    <label for="village">Village:</label>
    <input type="text" id="village" name="village"><br><br>

    <label for="weight">Weight:</label>
    <input type="number" id="weight" name="weight"><br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone"><br><br>

    <label for="aadhaar">Aadhaar Card:</label>
    <input type="text" id="aadhaar" name="aadhaar"><br><br>

    <label>Arogyasri Available:</label>
    <input type="radio" id="yes" name="arogya">
    <label for="yes">Yes</label>

    <input type="radio" id="no" name="arogya">
    <label for="no">No</label><br><br>

    <label for="abha">ABHA ID:</label>
    <input type="text" id="abha" name="abha"><br><br>

    <label for="purpose">Purpose of Visit:</label>
    <input type="text" id="purpose" name="purpose"><br><br>

    <label for="medication">Current Medication:</label>
    <input type="text" id="medication" name="medication"><br><br>

    <label for="allergies">Allergies:</label>
    <input type="text" id="allergies" name="allergies"><br><br>

    <label for="history">Previous History:</label>
    <input type="text" id="history" name="history"><br><br>

    <label for="reports">Reports:</label>
    <input type="file" id="reports" name="reports"><br><br>

    <label for="blood">Blood Group:</label>
    <input type="text" id="blood" name="blood"><br><br>

    <label for="insurance">Insurance:</label>
    <input type="text" id="insurance" name="insurance"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Clear">

</form>

</body>
</html>
