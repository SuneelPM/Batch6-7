<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS DATATYPES</title>
  </head>
  <body>
    <script>
      //Number datatype
      let num = 10;
      console.log(num);
      console.log(typeof num);
      // String datatype
      let name = "karthik";
      console.log("name:", name, "datatype:", typeof name);
      //Boolean datatype
      let bool = true;
      console.log("bool:", bool, "datatype:", typeof bool);
      //Undefined datatype
      let Undefined;
      console.log("undefinedVar:", undefined, "datatype:", typeof undefined);
      //Null datatype
      let nullVar = null;
      console.log("nullVar:", nullVar, "datatype:", nullVar);
      //Symbol
      let sym1 = Symbol();
      let sym2 = Symbol();
      console.log("sym1:", sym1, "datatype:", sym1);
      console.log("sym2:", sym2, "datatype:", sym2);
      console.log(sym1 == sym2);
    </script>
  </body>
</html>
