<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS STRINGS</title>
  </head>
  <body>
    <h1>JA Strings</h1>
    <script>
      let firstName = "karthik";
      let lastName = "Paidipaga";
      let fullName = firstName + lastName;
      let age = 21;
      //regular string concatenation
      let description = "my name is" + " " + firstName + " " + lastName + ".";
      //template literal - string construction or concatenation
      let description2 = `My name is ${firstName} ${lastName}.`;
      let description3 = `My name is ${firstName} ${lastName}, My age is ${age}.`;
      console.log(firstName, lastName);
      console.log(fullName);
      console.log(description);
      console.log(description2);
      console.log(description3);
      console.log(age + firstName);
      console.log(typeof (age + firstName));
    </script>
  </body>
</html>
