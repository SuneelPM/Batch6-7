      function caluclator(a, b, operation) {
        if (operation == "+") {
          console.log(a + b);
        } else if (operation == "-") {
          console.log(a - b);
        } else if (operation == "*") {
          console.log(a * b);
        } else if (operation == "/") {
          console.log(a / b);
        } else if (operation == "%") {
          console.log(a % b);
        } else if (operation == "**") {
          console.log(a ** b);
        } else {
          console.log("invalid");
        }
      }
