<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM - Document Object Model</title>
  </head>
  <body>
    <h1 id="heading">DOM - Document Object Model</h1>
    <div>
      <label for="num1">Number 1</label> <input id="num1" type="text" />
    </div>
    <div>
      <label for="num2">Number 2</label> <input id="num2" type="text" />
    </div>
    <div>
      <button id="btn1" onclick="addNumbers()">Add</button>
      <button id="btn2" onclick="mulNumber()">Multiply</button>
      <button id="btn3" onclick="clearData()">Clear</button>
    </div>

    <p id="result">Result is shown here</p>
    <script>
      const root = document;
      //   console.log(root);

      //5 methods to access html elements
      //1.getElementById
      function addNumbers() {
        result.textContent = Number(input1.value) + Number(input2.value);
      }

      function mulNumber() {
        result.textContent = Number(input1.value) * Number(input2.value);
      }
      function clearData() {
        input1.value = "";
        input2.value = "";
        result.textContent = "Result is shown here";
      }

      const heading = document.getElementById("heading");
      //   console.log(heading.textContent);
      //   heading.textContent = addNumbers(12, 13);

      const input1 = document.getElementById("num1");
      const input2 = document.getElementById("num2");
      const btn1 = document.getElementById("btn1");
      const btn2 = document.getElementById("btn2");
      const result = document.getElementById("result");
    </script>
  </body>
</html>
