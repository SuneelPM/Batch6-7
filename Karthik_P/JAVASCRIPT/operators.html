    <title>JS Operators</title>
  </head>
  <body>
    <script>
      let side = 10;
      console.log("area:", side * side);
      console.log("perimeter:", side * side);
      let length = 10;
      let width = 20;
      console.log("area:", length + width);
      console.log("perimeter:", 2 * (length + width));
      let radius = 20;
      const PI = 3.14;
      console.log("area:", PI * radius ** 2);
      console.log("perimeter:", 2 * PI * radius);
      //print volume of a sphere and surface area of a sphere

      let height = 10;

      }
    </script>
