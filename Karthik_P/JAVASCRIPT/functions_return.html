<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>functions with Return statements</title>
  </head>
  <body>
    <h1>functions with Return statements</h1>
    <script>
      function sum1(a, b) {
        return a + b;
      }

      function sum2(a, b) {
        console.log(a + b);
      }
      let c = sum1(12, 13);
      let d = sum2(20, 30);
      console.log(c, d);

      //write a function that returns hi,your name ,how are you?
      function greet(name) {
        return `Hi ${name}, How are you?`;
      }
    </script>
  </body>
</html>
