<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Shadow</title>
    <style>
        .button1{
            background-color: brown;
            box-shadow: gray 0px 8px 24px ;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button2{
            background-color: blueviolet;
            box-shadow:gray 0px 7px 29px 0px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;


            
        }
        .button3{
            background-color: blue;
            box-shadow: gray 1.95px 1.95px 2.6px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button4{
            background-color: blanchedalmond;
            box-shadow: gray 0px 5px 15px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button5{
            background-color:beige;
            box-shadow: gray 0px 1px 4px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button6{
            background-color: azure;
            box-shadow: gray 0px 3px 8px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button7{
            background-color: aquamarine;
            box-shadow: gray 0px 2px 8px 0px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button8{
            background-color: aqua;
            box-shadow: gray 0px 1px 4px, black 0px 0px 0px 3px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button9{
            background-color: antiquewhite;
            box-shadow: gray 0px 1px 3px 0px, gray 0px 0px 0px 1px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button10{
            background-color: pink;
            box-shadow: gray 0px 4px 12px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }

    </style>
</head>
<body>
    
    <button class="button1">click me</button>
    <button class="button2">click me</button>
    <button class="button3">click me</button>
    <button class="button4">click me</button>
    <button class="button5">click me</button>
    <button class="button6">click me</button>
    <button class="button7">click me</button>
    <button class="button8">click me</button>
    <button class="button9">click me</button>
    <button class="button10">click me</button>
   
</body>
</html>
