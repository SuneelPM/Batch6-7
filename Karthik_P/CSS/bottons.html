<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <style>
        button{
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px ;
        
        }

        .button1{
            background: #37b9dd;
            color:white;
        }

        .button2{
            background: #e5e5e5;
            color:white;
        }

        .button3{
            background: #79a88a;
            color:white;
        }

        .button4{
            background: white;
            border:1px solid #ccc;
        }

        .button5{
            background: #e71e1e;
            color:white;
        }

        .button6{
            background: white;
            border:1px solid #ccc;
            color:black;
        }

        .button7{
            background: #34ca52;
            color:white;
        }

        .button8{
            background: #e6f2ff;
            border:1px solid #4f6d8f;
            color:#2c5f8a;

        }

        .button9{
            background: linear-gradient(45deg,#4b6cff,#3b5bdc);
            color:white;
            box-shadow: 0 4px 10px rgba(0,0,0,2);
        }

        .button910{
            background: linear-gradient(#6c7987,#1c6ed5);
            color:white;
            border-radius: 20px;
        }

        .button11{
            background: #f5f5f5;
            border:1px solid #ddd;
            color:black;
        }

        .button12{
            background: #6e6e6e;
            color:white;
        }

        .button13{
            background: #f7f7f7;
            border:1px solid #ccc;
        }

        .button14{
            background: #e5e5e5;
            border:1px solid #999;
        }

      
            


    </style>
</head>
<body>
    <button class="button1">Button1</button>
    <button class="button2">Button2</button>
    <button class="button3">Button3</button>
    <button class="button4">Button4</button>
    <button class="button5">Button5</button>
    <button class="button6">Button6</button>
    <button class="button7">Button7</button>
    <button class="button8">Button8</button>
    <button class="button9">Button9</button>
    <button class="button10">Button10</button>
    <button class="button11">Button11</button>
    <button class="button12">Button12</button>
    <button class="button13">Button13</button>
    <button class="button14">Button14</button>
    <button class="button15">Button15</button>

</body>
</html>
