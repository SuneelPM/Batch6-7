<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layout 1</title>
<style>
body {
  margin: 0;
  /* font-family: Arial; */
  
}

.layout {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  height: 100vh;
}

header {
  background: teal;
  color: white;
  text-align: center;
  padding: 20px;
}

.main {
  display: flex;
  gap: 10px;
  flex: 6;
  
}

aside {
  background: rgb(77, 188, 188);
  flex: 1;
  padding: 30px;
  color: white;
  place-content:center ;
  align-items: center;
  

}

article {
  background-color: rgb(179, 96, 96);
  flex: 3;
  padding: 20px;
  color: white;
  display: flex;
  align-items: end;
  
  
  
}

.images {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  height: 100px;
  flex: 1;

}

.image1{
  background-color: rgb(230, 212, 212);
  text-align: center;
  flex: 1;
  /* height: 100px; */
  padding: 10px;
  place-content: center;
}
.image2{
  background-color: rgb(224, 210, 210);
  text-align: center;
  flex: 1;
  /* height: 100px; */
  padding: 10px;
  place-content: center;
}
.image3{
  background-color: rgb(216, 201, 201);
  text-align: center;
  flex: 1;
  /* height: 100px; */
  padding: 10px;
  place-content: center;
}
footer{
  background: teal;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>
<div class="layout">
  <header>Header</header>

  <div class="main">
    <aside>Aside</aside>

    <article>
      <div class="images">
        <div class="image1">Image1</div>
        <div class="image2">Image2</div>
        <div class="image3">Image3</div>
      </div>
    </article>
  </div>

  <footer>Footer</footer>
</div>
</body>
</html>
