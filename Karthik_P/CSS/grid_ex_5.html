<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid ex 5</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: repeat(5,fr);
            grid-template-rows: repeat(5,fr);
            gap: 10px;
            height: 200px;
        }
        .gi{
            background-color: blueviolet;
            text-align: center;
            place-content: center;
        }
        .gi1{
            grid-column: 1 /2;
            grid-row: 1 /5;
            background-color: red;
            color: white;
        }
        .gi2{
            grid-column: 2 /4;
            grid-row: 1 /3;
            background-color: greenyellow;
            color: white;
        }
        .gi3{
            grid-column: 2 /3;
            grid-row: 3 /5;
            background-color: rgb(199, 84, 163);
            color: white;
        }
        .gi4{
            grid-column: 3 /4;
            grid-row: 3 /4;
            color: white;
        }
        .gi5{
            grid-column: 3 /4;
            grid-row: 4 /5;
            color: white;
        }

    </style>
</head>
<body>
    <div class="gc">
        <div class="gi gi1">1</div>
        <div class="gi gi2">2</div>
        <div class="gi gi3">3</div>
        <div class="gi gi4">4a</div>
        <div class="gi gi5">4b</div>
    </div>
</body>
</html>
