<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        .layout{
            display: flex;
            flex-direction: column;
            background-color: antiquewhite;
            height: 100vh;
        }
        .header{
            background-color: rgb(107, 184, 184);
        }
        .content{
            flex: 6;
            display: flex;
            gap: 10px;
            
        }
        .aside{
            background: rgb(77, 188, 188);
            flex: 1;
            padding: 20px;
            color: white;
            align-items: end;
            justify-content: center;

        }
        .article{
            background-color: aquamarine;
            height: 100px;
            flex: 3;
            display: flex;
            align-items: end;
            place-content: center;
        }
        .images {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

.image1{
  background-color: rgb(167, 157, 157);
  text-align: center;
  flex: 1;
  height: 100px;
  padding: 10px;
  justify-content: center;
}
.image2{
  background-color: rgb(167, 157, 157);
  text-align: center;
  text-align: center;
  flex: 1;
  height: 100px;
  padding: 10px;
  justify-content: center;
}
.image3{
  background-color: rgb(167, 157, 157);
  text-align: center;
  text-align: center;
  flex: 1;
  height: 100px;
  padding: 10px;
  justify-content: center;
}
    </style>
</head>
<body>
    <div class="layout">
        <div class="header">Header</div>
        <div class="content">Content</div>
            <div class="aside">Aside</div>
            <div class="article">
                <div class="image image1">image1</div>
                <div class="image image2">image2</div>
                <div class="image image3">image3</div>
            </div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
