        // greet('virat',saygoodbye);
        // greet('virat',sayhi);

        function runMe(callback) {
            callback();
        }
        //general fn
        function hello() {
            console.log('hello');
        }
        //fn expression
        const hellojs=function () {
             console.log('hello javascript');
        }

        runMe(hello);
        runMe(hellojs);
//anonymous arrow fn
        runMe(()=> console.log('hi'));
//directly write fn definition
        runMe(function helloworld() {
            console.log('hello world');
        })





    </script>
