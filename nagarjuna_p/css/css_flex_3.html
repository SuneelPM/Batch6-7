<!DOCTYPE html>
<html>
<head>
  <title>Navbar Design</title>
  <style>

    body {
  background: #e5e5e5;
  font-family: Arial;
}


.navbar {
  width: 90%;
  margin: 30px auto;
  background: black;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}


.logo {
  font-weight: bold;
  font-size: 20px;
}


.nav-links {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 30px;
}

.nav-links li {
  cursor: pointer;
  position: relative;
}

.nav-links li.active::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 2px;
  background: white;
  bottom: -5px;
  left: 0;
}

.btn-fill {
  background: #d4ff3f;
  border: none;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

.btn-outline {
  background: transparent;
  border: 2px solid #d4ff3f;
  color: #d4ff3f;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}
  </style>
</head>
<body>

  
  <div class="navbar">
    <div class="logo">LOGO</div>
    <ul class="nav-links">
      <li>About us</li>
      <li>Portfolio</li>
      <li>Services</li>
      <li><button class="btn-fill">Contact us</button></li>
    </ul>
  </div>

  
  <div class="navbar">
    <div class="logo">LOGO</div>
    <ul class="nav-links">
      <li class="active">About us</li>
      <li>Portfolio</li>
      <li>Services</li>
      <li><button class="btn-fill">Contact us</button></li>
    </ul>
  </div>

  <div class="navbar">
    <div class="logo">LOGO</div>
    <ul class="nav-links">
      <li>About us</li>
      <li>Portfolio</li>
      <li>Services</li>
      <li><button class="btn-outline">Contact us</button></li>
    </ul>
  </div>

</body>
</html>
