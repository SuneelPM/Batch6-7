<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css buttons</title>
    <style>
        .btn7{
  width:120px;
  height:120px;
  border:5px solid #333;
  border-radius:20px;
  background:white;
  font-size:24px;
  
}
.btn10{
  width:120px;
  height:120px;
  border-radius:15px;
  font-size:24px;
  border-color: white;
}
.btn11{
  width:120px;
  height:120px;
  background:white;
  border:2px solid #ccc;
  border-radius:15px;
  font-size:24px;
}
.btn12{
  width:120px;
  height:120px;
  background:#eee;
  border-radius:15px;
  font-size:24px;
}
 

            
        
        
            
        
        .button6{
            background-color: azure;
            box-shadow: gray 0px 3px 8px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button7{
            background-color: aquamarine;
            box-shadow: gray 0px 2px 8px 0px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button8{
            background-color: aqua;
            box-shadow: gray 0px 1px 4px, black 0px 0px 0px 3px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button9{
            background-color: antiquewhite;
            box-shadow: gray 0px 1px 3px 0px, gray 0px 0px 0px 1px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }
        .button10{
            background-color: pink;
            box-shadow: gray 0px 4px 12px;
            padding:12px 25px;
            border:none;
            border-radius: 8px;
            font-size: 16px;
            cursor:pointer;
            margin:10px;
            height: 100px;
            
        }

    </style>
</head>
<body>
    
  
  
    <button class="button6">button6</button>
    <button class="button7">button7</button>
    <button class="button8">button8</button>
    <button class="button9">button9</button>
    <button class="button10">button 10</button>
   
  





  

</head>
<body>
    <hr>
    <button class="btn7">#7</button>
     <button class="btn10">#10</button>
    <button class="btn11">#11</button>
    <button class="btn12">#12</button>
    
    
    

    


</body>
</html>
