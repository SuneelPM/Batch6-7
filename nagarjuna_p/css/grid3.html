<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
    <style>
        body{
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
        }
        .container{
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }
        .question-box{
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .options{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option{
            padding: 15px;
            border-radius: 10px;
            background: #f1f2f6;
            text-align: center;
        }
        .title{
            color: gray;
            margin-bottom: 50px;
        }
        .grid-container{
            display: grid;
            grid-template-columns: repeat(5,50px);
            gap: 10px;
        }
        .grid-item{
            background-color: lightgray;
            border-radius: 8px;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }
        .legend{
            margin-top: 30px;
        }
        .legend-item{
            display: grid;
            grid-template-columns: 20px auto;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .legend-box{
            width: 15px;
            height: 15px;
            border-radius: 4px;
        }
        .attempted{ background:lightblue }
        .skipped{ background:lightyellow }
        .review{ background:lightpink }
        .not-visited{ background:lightgreys }
    </style>
</head>
<body>
        <div>
            <div class="title">QUIZ PROGRESS</div>
            <div class="grid-container">
                <div class="grid-item">1</div>
                <div class="grid-item">2</div>
                <div class="grid-item">3</div>
                <div class="grid-item">4</div>
                <div class="grid-item">5</div>
                <div class="grid-item">6</div>
                <div class="grid-item">7</div>
                <div class="grid-item">8</div>
                <div class="grid-item">9</div>
                <div class="grid-item">10</div>
                <div class="grid-item">11</div>
                <div class="grid-item">12</div>
                <div class="grid-item">13</div>
                <div class="grid-item">14</div>
                <div class="grid-item">15</div>
                <div class="grid-item">16</div>
                <div class="grid-item">17</div>
                <div class="grid-item">18</div>
                <div class="grid-item">19</div>
                <div class="grid-item">20</div>
            </div>
            <div class="legend">
                <div class="title">LEGEND</div>
                <div class="legend-item">
                    <div class="legend-box attempted"></div>
                    Attempted
                </div>
                <div class="legend-item">
                    <div class="legend-box skipped"></div>
                    Skipped
                </div>
                <div class="legend-item">
                    <div class="legend-box review"></div>
                    Review Later
                </div>
                <div class="legend-item">
                    <div class="legend-box not-visited"></div>
                    Not Visited
                </div>
            </div>
        </div>
    </div>
</body>
</html>
