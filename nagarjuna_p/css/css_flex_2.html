<!DOCTYPE html>
<html>
<head>
  <title>Layout</title>
  <style>
    


header {
  background-color: teal;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 24px;
}
footer{
      background-color: teal;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 24px;
}

.container {
  display: flex;
  height: 70vh;
  gap: 10px;
  padding: 10px;
}


.box {
  flex: 1;
  background-color: #3aa6b9;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  border: 5px solid white;
}

  </style>
</head>
<body>

  <header>Header</header>

  <div class="container">
    <div class="box">Inbox etc.</div>
    <div class="box">Message list</div>
    <div class="box">Message</div>
  </div>

  <footer>Footer</footer>

</body>
</html>
