<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grand parent{
            position: relative;
        }
        .parent{
            height: 500px;
            width: 500px;
            background-color:red;
            position: relative;
            top: 100px;
        }
        *{
            margin: 0px;
        }
        .child{
            height: 100px;
            width: 100px;
        }
        .child-1{
            background-color: aqua;
        }
        .child-2{
            background-color: blue;
            position: absolute;
            top: 0px;
            left: 100px;

            
        }
        .child-3{
            background-color: green;
            position: absolute;
            left: 200px;
            top: 0px;
        

        }
      
      
    </style>
</head>
<body>
    <div>
        <div class="grand-parent">
    </div>
    <div class="parent">
    <div class="child-1 child" >child 1</div>
     <div class="child-2 child">child 2</div>
      <div class="child-3 child">child 3</div>
    </div>
    </div>
</body>
</html>
