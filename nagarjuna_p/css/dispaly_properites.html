<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .none1 { 
            display: none;
            width: 50px; 
        }
        .none2 { 

            display: none; 
        }
        .none3 { 

            display: none; 
        }
        .none4 { 

            display: none; 
        }
        .none5 { 

            display: none; 
        }
        .block1 {
             display: block; background: lightblue; 
            }
        .block2 {
             display: block; background: lightgreen; 
            }
        .block3 {
             display: block; background: pink; 
            }
        .block4 {
             display: block; background: orange; 
            }
        .block5 {
             display: block; background: violet; 
            }
        .inline1 {
             display: inline; background: blue; 
            }
        .inline2 {
             display: inline; background: lightcoral; 
            }
        .inline3 {
             display: inline; background: lightgray; 
            }
        .inline4 {
             display: inline; background: purple; 
            }
        .inline5 {
             display: inline; background: lightpink; 
            }
        .s1 { display: inline-block; width: 100px; height: 100px; background: red; 
        }
        .s2 { display: inline-block; width: 100px; height: 100px; background: blue; 
        }
        .s3 { display: inline-block; width: 100px; height: 100px; background: gold;
         }
        .s4 { display: inline-block; width: 100px; height: 100px; background: maroon; 
        }
        
               
        
    </style>
</head>
<body>
    <p class="none1">This is hidden paragraph</p>
    <div class="none2">Hidden div</div>
    <h1 class="none3">Hidden heading</h1>
    <span class="none4">Hidden span</span>
    <button class="none5">Hidden button</button>

    <span class="block1">Block Span 1</span>
    <span class="block2">Block Span 2</span>
    <span class="block3">Block Span 3</span>
    <a class="block4">Block Link</a>
    <a class="block5">Block Link 2</a>

    <div class="inline1">Inline Div 1</div>
    <div class="inline2">Inline Div 2</div>
    <p class="inline3">Inline Paragraph</p>
    <h1 class="inline4">Inline Heading</h1>
    <button class="inline5">Inline Button</button>

    <div class="s1">Box1</div>
    <div class="s2">Box2</div>
    <div class="s3">Box3</div>
    <div class="s4">Box4</div>
    
    
</body>
</html>
