    <script>
        const items=document.getElementsByClassName("items")
        const animalCollection=document.getElementsByClassName("animals")
        let fruits=["Apple","Mango","Watermelon"];
        let animalsArray=['Dog','Cat','Lion','Tiger','Giraffe','Camel','Elephant','Goat','Horse','Rat']
        
        
         let itemsArray=Array.from(items);
         itemsArray.map((element,index)=>element.textContent=fruits[index])

         animalslist.map((element,index)=>element.textContent=animalsArray[index])
