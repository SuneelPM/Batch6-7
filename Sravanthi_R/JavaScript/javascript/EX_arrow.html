<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions exercise</title>
</head>
<body>
    <script>
        //write a arrow function that return factorial of n
        //const factorial = n => n == 0 ? 1 : n * factorial(n - 1);
        //console.log(factorial(4));

        const factorial = n => n < 0 
        ? "Invalid input" 
        : n == 0 || n == 1 
        ? 1
        : n * factorial(n - 1);
        console.log(factorial(4));
        
    </script>   
</body>
</html>
