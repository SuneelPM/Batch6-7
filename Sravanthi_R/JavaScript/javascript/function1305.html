        function mult(num1, num2) {
        console.log(num1 * num2);
        }
                function div(num1, num2) {

                }




        // function call
        sum();

        function calculator1(num1,num2,operation){

        
            if(operation == '-')
        {
            sub(num1,num2);
        }
        else if(operation == '*')
        {
            mult(num1,num2);
        }
        else if(operation =='/')
        {
            div(num1,num2);
        }

        }
        calculator(10,5,'-');

        // switch case
        function calculator2(num1,num2,operation){
            switch(operation)
            {
                case '-':
                    sub(num1,num2);
                    break;
                case '*':
                        mult(num1, num2);
                        break;
                case'/':
                        div(num1,num2);
                        break;
            }
        }
