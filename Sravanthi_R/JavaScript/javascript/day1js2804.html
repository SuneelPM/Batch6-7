<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript</h1>
    <script>
        //this is the print statement in the javascript
        console.log("hello world");
        /*this is a pop up just show the msg */
       
        //three ways od declering a variable
        var age=10;
        let name="sravss";
        const PI=3.145;
        console.log(age,name,PI)
        
        //number
        let id=73;
        console.log(typeof id,id);
        //string
        let firstname="sravss"
        console.log(typeof firstname,firstname)
        //boolean
        let ch=true;
        console.log(typeof ch,ch);
        //undifined
        let aadharnumber;
        console.log(typeof aadharnumber,aadharnumber);
        //null
        let nullvariable=null;
        console.log(typeof nullvariable,nullvariable);
        //simbol
        let firstsymbol=Symbol()
        console.log(typeof firstsymbol,firstsymbol);
        //bigint
        let bignum=10n;
        console.log(typeof bignum,bignum);

        //number of ways to create a string
        //three ways
        //single quote
        let fstname="mahesh"
        let midname="babu"
        let lstname='gattamaneni'
        let fullname=`${fstname} ${midname} ${lstname}`;
        console.log(fullname);

        // let myage=Number(prompt("enter your age:",80));
        // console.log(typeof myage,myage);

        let heroname=prompt("please enter your hero name","ram");
        console.log(typeof heroname,heroname);

        let isconfirm=confirm("Are you sure")
        console.log(typeof isconfirm,isconfirm)

    </script>
</body>
</html>
