         let reversed = str.split("").reverse().join("");

          //reverse a string without using any built in methods  
        function reverseString(str) {
    let reversed = "";
    for (let i = str.length - 1; i >= 0; i--) {
        reversed += str[i];
    }
    return reversed;
    }
