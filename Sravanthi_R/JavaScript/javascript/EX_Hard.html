<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Combine slice and splice 
    let source = [1, 2, 3, 4, 5, 6];
    let target = [7, 8] 
    let lastThree = source.slice(-3); 
    target.splice(0, 0, ...lastThree);
    console.log(target); // [4, 5, 6, 7, 8]
    
    
    //Find second occurrence 
    let nums = [1, 2, 3, 2, 4, 2];
    let first = nums.indexOf(2);
    let second = nums.indexOf(2, first + 1); 
    console.log(second); // 3
    
    //Dynamic deletion 
    function removeItem(arr, item) {
        let index = arr.indexOf(item);
        if (index !== -1) {
            arr.splice(index, 1);
        }
        return arr;
    }
    
    //Safe array palindrome 
    function isPalindrome(arr) {
        let orig = arr.join('');
        // slice() creates copy before reverse
        let rev = arr.slice().reverse().join('');
        return orig === rev;
    }
    
    //The master chain
    let num = new Array(1, 2, 3, 4, 5);
    // slice(1, 4) gets indices 1, 2, 3
    let res = num.slice(1, 4).reverse().join(' -> ');
    console.log(res); // "4 -> 3 -> 2"
    
    
    //Splice to move element 
    let arr1 = [10, 20, 30, 40];
    let idx1 = arr1.indexOf(20);
    if(idx1 > -1) {
        let item = arr1.splice(idx1, 1)[0];
        arr1.splice(arr1.length, 0, item);
    }
    console.log(arr1); // [10, 30, 40, 20]
    
    
    //Insert array into string 
    let main = ['a', 'b', 'c', 'd'];
    let insert = ['x', 'y'];
    main.splice(2, 0, ...insert);
    console.log(main); // ["a", "b", "x", "y", "c", "d
    
    
    //Replace all occurance 
    let words = ['bad', 'ok', 'bad'];
    let idx = words.indexOf('bad');
    while (idx !== -1) {
        words.splice(idx, 1, 'good');
        idx = words.indexOf('bad', idx + 1);
    }
    console.log(words); // ["good", "ok", "good"]
    
    //Split,reverse,join
    let str1 = "hello";
    // Spread syntax converts iterable to array
    let arr2 = [...str1]; 
    let reversedStr = arr2.reverse().join('');
    console.log(reversedStr); // "olleh"
    
    
    //Slice to excludeends
    function trimEnds(arr) {
        if (arr.length <= 2) return [];
        return arr.slice(1, -1);
    }
    console.log(trimEnds([1, 2, 3, 4])); // [2, 3]
    
    //Splice return values 
    let arr3  = ['a', 'b', 'c'];
    let deleted = arr3.splice(1, 1); 
    console.log(deleted); // ["b"]
    
    //Strictly Boolean includes 
    let arr4 = [1, 2, 3]; 
    console.log(arr4.includes(2)); //
    
    
    //Swap two elements 
    let arr5 = [10, 50, 30];
    let i1 = arr5.indexOf(50);
    let i2 = arr5.indexOf(30);
    let val1 = arr5.splice(i1, 1)[0]; 
    arr5.splice(i1, 0, 30);
    arr5.splice(i2, 1);
    arr5.splice(i2, 0, val1);
    console.log(arr5); // [10, 30, 50]
    
    
    //Negative splice index
    let arr6 = [1, 2, 99];
    arr6.splice(-1, 1, 3);
    console.log(arr6);
    
   
    //Creating a range 
    let emptyArr = new Array(4);
    let str = emptyArr.join(',');
    console.log(str); // ",,,"
    
    //Array constructor map
    let A = new Array(3); 
    console.log(A); // [empty × 3]
    let B = new Array('3');
    console.log(B); // ["3"]
    
    
    //Splice injection 
    let a = [1, 2, 5, 6];
    let b = [3, 4];
    A.splice(2, 0, ...b);
    console.log(a); // [1, 2, 3, 4, 5, 6]
    
    
    //Custom join implementation 
    function customJoin(arr, sep = ',') {
        if (arr.length === 0) return "";
        let result = String(arr[0] ?? "");
        for (let i = 1; i < arr.length; i++) {
            result += sep + String(arr[i] ?? "");
        }
        return result;
    }
    console.log(customJoin([1, null, 3], '-')); // "1--3"
    
    
    //Multi dimensional slice
    let matrix = [[1, 2], [3, 4], [5, 6]];
    let shallow = matrix.slice(0, 1); // Returns [[1, 2]]
    shallow[0][0] = 99;
    console.log(matrix[0][0]); // 99
    
    
    
    //Removing duplicates (indexof)
    function unique(arr) {
        let result = [];
        for (let i = 0; i < arr.length; i++) {
            if (result.indexOf(arr[i]) === -1) {
                result.push(arr[i]);
            }
        }
        return result;
    }
    console.log(unique([1, 2, 2, 3, 1])); // [1, 2, 3]
    
    
    //Circular shift right
    let arr7 = [1, 2, 3, 4];
    let lastItem = arr7.splice(-1, 1)[0];
    arr7.splice(0, 0, lastItem);
    console.log(arr7); // [4, 1, 2, 3]
    
    
    
    //Nan detection (indexof vs includes)
    let arr = [1, NaN, 3];
    console.log(arr.indexOf(NaN)); // -1
    console.log(arr.includes(NaN)); // true
    
    
    
    //Inter leveling arrays 
    let x = ['a', 'c', 'e'];
    let y = ['b', 'd'];
    let insertPos = 1;
    for (let i = 0; i < y.length; i++) {
        x.splice(insertPos, 0, y[i]);
        insertPos += 2; // Move 2 spaces forward to interleave
    }
    console.log(x); // ["a", "b", "c", "d", "e"]
    
    
    //Extracting and joining domains 
    let urls = ['http://google.com', 'https://bing.com'];
    let domains = [];   
    for (let url of urls) {
        let slashIdx = url.indexOf('//');
        if (slashIdx !== -1) {
            domains.push(url.slice(slashIdx + 2)); 
        }
    }
    console.log(domains.join(', ')); // "google.com, bing.com"
    </script>
</body>
</html>
