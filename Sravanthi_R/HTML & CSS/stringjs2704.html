<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS strings</title>
</head>
<body>
    <h1>JS strings</h1>
    <script>
        let firn = "Sri";
        let ln = "Manu";
        let fn = firn + ln;
        let age = 22;
        let username = "Guest";
        let protocol = "https";
        let domain = "google.com";
        let description1 = "my name is " + fn +" "+ "my age is " + age ; //regular concatination.
        let description2 = `my name is ${fn} and my age is ${age}`; // template literal.
        let description3 = "my name is \""+ fn + "\"my age is " + age ; //to give sepecific string "".
        let description4 = "my name is '" + fn + "' my age is " + age; //to give sepecific string ''.
        let description5 = "my name is '" + fn + "'. \n" + "my age is " + age;
        let description6 = "JavaScript's power is \"unlimited\"!";
        let description7 = `JavaScript's power is "unlimited"!`;
        let description8 = `Welcome, ${username}!, Today is Wednesday.`;
        let url = `${protocol}://${domain}`;
        console.log(firn, ln);
        console.log(fn);
        console.log(description1);
        console.log(description2);
        console.log(description3);
        console.log(description4);
        console.log(description5);
        console.log(description6);
        console.log(description7);
        console.log(description8);
        console.log(typeof firn + age);
        console.log(url);
        
    </script>
</body>
</html>
