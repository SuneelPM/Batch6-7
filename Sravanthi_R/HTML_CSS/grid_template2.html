<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns:4fr 2fr 2fr ;
            grid-template-rows:1fr 1fr 1fr ;
            height: 200px;
            gap: 10px;
            grid-template-areas: "aside1 header header"
                                 "aside1 body aside2"
                                 "aside1 body footer";
        }
        .gi{
            background-color: pink;

        }
        .gi1{
            grid-area: header;

        }
        .gi2{
             grid-area: aside1;
            }
        .gi3{
             grid-area: body;
        }
        .gi4{
            grid-area:aside2 ;
        }
        .gi5{
            grid-area: footer;
        }
       

    </style>
</head>
<body>
    <h1>Gtid tmplate ares</h1>
    <div class="gc">
        <div class="gi gi1">Header</div>
        <div class="gi gi2">aside1</div>
        <div class="gi gi3">content</div>
        <div class="gi gi4">aside2</div>
        <div class="gi gi5">Footer</div>
        
    </div>
</body>
</html>
