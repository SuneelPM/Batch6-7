<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            display: flex;
            flex-direction:100px;
            gap: 10px;
        }
        .flex-item{
            background-color: blueviolet;
            color: wheat;
            padding: 10px;
            width: 100px;
            height: 100px;
            /* flex-grow: 2; */
        }
        .flex-item1{
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 1;
        }
        .flex-item2{
            flex-basis: 200px;
            flex-grow: 2;
            flex-shrink: 2;
        }
        .flex-item3{
           flex-basis: 100px;
           flex-grow: 3;
           flex-shrink: 3;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item flex-item1">flex-item 1</div>
        <div class="flex-item flex-item2">flex-item 2</div>
        <div class="flex-item flex-item3">flex-item 3</div>
    </div>
</body>
</html>
