<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-item{
            background-color:pink;
            padding: 10px;
            border: 1px solid blue;
            
        }
        .flex-item-1{
            order: -3;
        }
       .flex-item-2{
            order: -2;
       }
       .flex-item-3{
            order: -1;
       }
       .flex-item-12{
            order: 1;
       }
    </style>
</head>
<body>
    <h1>CSS Flex Items</h1>
    <div class="flex-container">
        <div class="flex-item flex-item-1">flex-item1</div>
        <div class="flex-item flex-item-2">flex-item2</div>
        <div class="flex-item flex-item-3">flex-item3</div>
        <div class="flex-item flex-item-4">flex-item4</div>
        <div class="flex-item flex-item-5">flex-item5</div>
        <div class="flex-item flex-item-6">flex-item6</div>
        <div class="flex-item flex-item-7">flex-item7</div>
        <div class="flex-item flex-item-8">flex-item8</div>
        <div class="flex-item flex-item-9">flex-item9</div>
        <div class="flex-item flex-item-10">flex-item10</div>
        <div class="flex-item flex-item-11">flex-item11</div>
        <div class="flex-item flex-item-12">flex-item12</div>
        <div class="flex-item flex-item-13">flex-item13</div>
        <div class="flex-item flex-item-14">flex-item14</div>
        <div class="flex-item flex-item-15">flex-item15</div>
        <div class="flex-item flex-item-16">flex-item16</div>
        <div class="flex-item flex-item-17">flex-item17</div>
        <div class="flex-item flex-item-18">flex-item18</div>
        <div class="flex-item flex-item-19">flex-item19</div>
        <div class="flex-item flex-item-20">flex-item20</div>
    </div>
</body>
</html>
