<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,1fr);
            /* gap: 10px; */
            height: 100vh;
            background-image: url(images/clouds-country-daylight-371633.jpg);

        }
        .gi{
            background-color: transparent;
            color: white;
            border-radius: 20px;
            text-align: center;
            place-content: center;
            border: 5px solid white;
            
        }
        .gi1{
            grid-column: 1/3;
            grid-row: 1/2;
        }
        .gi2{
            grid-column:3/4 ;
            grid-row:1/3 ;
        }
        .gi3{
            grid-column: 2/3;
            grid-row: 2/3;
        }
        .gi4{
            grid-column:2/4 ;
            grid-row:3/4 ;
        }
        .gi5{
            grid-column:1/2 ;
            grid-row:2/4 ;
        }
    </style>
</head>
<body>
    <h2>CSS Grid layout 4</h2>
    <div class="gc">
        <div class="gi gi1">gi 1</div>
        <div class="gi gi2">gi 2</div>
        <div class="gi gi3">gi 3</div>
        <div class="gi gi4">gi 4</div>
        <div class="gi gi5">gi 5</div>
    </div>
</body>
</html>
