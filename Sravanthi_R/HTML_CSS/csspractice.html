<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

ul, ol {

    color:black ;
    background-color: pink;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid black;
    box-shadow: 2px 2px 2px 2px blueviolet ;
    list-style-position: inside;

}

table {
    padding: 10px;
    border-collapse: collapse;
    color: blue;
    background-color: aqua;
}
table,th,td{
    border: 2px solid;
    color: black;
}
input {
    border: 1px solid black;
    color:green;
    background-color:greenyellow;
    padding: 10px;
    box-shadow: 2px 2px 2px 2px grey ;

}

div {
    border: 1px solid black;
    color:black ;
    background-color: pink;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 2px 2px 2px 2px blueviolet ;
}
</style>
</head>
<body>

<ul>
    <li>Item 1</li>
    <li>Item 2</li>
</ul>

<br>

<ol>
    <li>First</li>
    <li>Second</li>
</ol>

<br>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
    </tr>
    <tr>
        <td>Sravanthi</td>
        <td>20</td>
    </tr>
</table>

<br>

<input type="text" placeholder="Enter name">

<br><br>

<div>
    <h3>Student Details</h3>
     Name:<input type="text"><br></br> age:<input type="text">
</div>

</body>
</html>
