<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .child{
            width: 100px;
            height: 100px;
           
        }
         .child-1{
            background-color: aqua;
            position: relative;
            /* top: 10px;
            left: 10px; */
         }
         
         .child-2{
            background-color: blueviolet;
            top: -100px;
            position: relative;
            left: 100px;
            
         }
         .child-3{
            background-color: purple;
            position: relative;
            top:-200px;
            left: 200px;

            
         }

    </style>
</head>
<body>
    <h1>CSS Position Relative</h1>
    <div class="parent">
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
    </div>
</body>
</html>
