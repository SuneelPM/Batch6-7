<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .gc{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 4fr 1fr 1fr;
            gap: 10px;
            height: 300px;
        }
        .gi{
            background-color: green;
            text-align: center;
            place-content: center;
        }
        .gi1{
            grid-column:1/3;
            grid-row:1/2 ;
        }
        .gi2{
            grid-column: 1/2;
            grid-row: 2/3;
        }
        .gi3{
            grid-column:2/3 ;
            grid-row:2/3 ;
        }
        .gi4{
            grid-column:1/3;
            grid-row: 3/4;
        }
    </style>
</head>
<body>
    <div class="gc">
        <gi class="gi gi1">gi1</gi>
        <gi class="gi gi2">gi2</gi>
        <gi class="gi gi3">gi3</gi>
        <gi class="gi gi4">gi4</gi>
    </div>
</body>
</html>
