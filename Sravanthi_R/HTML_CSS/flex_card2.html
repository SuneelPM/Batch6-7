<!DOCTYPE html>
<html>
<head>
<style>
.header, .footer {
  background: teal;
  color: white;
  text-align: center;
  place-content: center;
  flex: 1;
  height: 50px;
  gap: 10px;
  padding: 10px;
}
.container {
  display: flex;
}

.left {
  display: flex;
  flex-direction: column;
  width: 30%;
}

.hero {
  background: #c8b6d8;
  padding: 60px;

}

.sidebar {
  background: #9acd66;
  padding: 60px;
}

.right {
  width: 70%;
  display: flex;
  flex-direction: column;
}

.main {
  background: orange;
  padding: 80px;
}

.extra {
  background: gray;
  padding: 40px;
}

.bottom {
  display: flex;
}

.images {
  background: green;
  flex: 3;
  padding: 40px;
}

.posts {
  background: pink;
  flex: 1;
  padding: 40px;
}
</style>
</head>

<body>

<div class="header">Header</div>

<div class="container">
  <div class="left">
    <div class="hero">Hero</div>
    <div class="sidebar">Sidebar</div>
  </div>

  <div class="right">
    <div class="main">Main Content</div>
    <div class="extra">Extra Content</div>

    <div class="bottom">
      <div class="images">Related Images</div>
      <div class="posts">Related Posts</div>
    </div>
  </div>
</div>

<div class="footer">Footer</div>

</body>
</html>
