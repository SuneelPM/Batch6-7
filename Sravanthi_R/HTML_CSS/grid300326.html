<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: grid;
            grid-template-columns: 200px 200px; /* repeat(3,200px)*/
            grid-template-rows: 100px 1fr;
            gap:10px;
            height: 500px;
        }
        .child{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>CSS Grid Properties</h1>
    <div class="parent">
        <div class="child child1">child1</div>
        <div class="child child2">child2</div>
        <div class="child child3">child3</div>
        <div class="child child4">child4</div>
        <div class="child child5">child5</div>
        <div class="child child6">child6</div>
    </div>
</body>
</html>
