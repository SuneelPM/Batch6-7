<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows:2fr 1fr 2fr 3fr;
            gap: 10px;
            height: 500px;
        }
        .gi{
            background-color: blueviolet;
            text-align: center;
            place-content: center;
        }
        .gi1{
            grid-column: 1/2;
            grid-row:1/2 ;
        }
        .gi2{
            grid-column: 1/2;
            grid-row:2/3 ;
        }
        .gi3{
            grid-column:1/2 ;
            grid-row: 3/4;
        }
        .gi4{
            grid-column: 1/3;
            grid-row: 4/5;
        }
        .gi5{
            grid-column: 2/3;
            grid-row:1/2 ;
        }
        .gi6{
            grid-column:2/3 ;
            grid-row: 2/3;
        }
        .gi7{
            grid-column: 2/3;
            grid-row: 3/4;
        }
    </style>
</head>
<body>
    <div class="gc">
        <div class="gi gi1">gi1</div>
        <div class="gi gi2">gi2</div>
        <div class="gi gi3">gi3</div>
        <div class="gi gi4">gi4</div>
        <div class="gi gi5">gi5</div>
        <div class="gi gi6">gi6</div>
        <div class="gi gi7">gi7</div>
    </div>
</body>
</html>
