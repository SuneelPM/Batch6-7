<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc{
            display: grid;
            grid-template-columns:1fr 2fr 1fr ;
            grid-template-rows: 1fr 3fr 1fr;
            /* gap: 10px; */
            height: 500px;
        }
        .gi{
            /* background-color: orange; */
            text-align: center;
            place-content: center;
        }
        .gi1{
            background-color: red;
            grid-column:1/4 ;
            grid-row:1/2 ;
        }
        .gi2{
            background-color: blue;
            grid-column: 1/2;
            grid-row: 2/3;
        }
        .gi3{
            background-color: purple;
            grid-column:2/3 ;
            grid-row:2/3 ;
        }
        .gi4{
            background-color: lawngreen;
            grid-column:3/4 ;
            grid-row: 2/3;
        }
        .gi5{
            background-color: palevioletred;
            grid-column:1/4 ;
            grid-row: 3/4;
        }
    </style>
</head>
<body>
    <div class="gc">
        <div class="gi gi1">gi 1</div>
        <div class="gi gi2">gi 2</div>
        <div class="gi gi3">gi 3</div>
        <div class="gi gi4">gi 4</div>
        <div class="gi gi5">gi 5</div>
    </div>
</body>
</html>
