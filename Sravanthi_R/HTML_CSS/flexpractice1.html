<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coloring</title>
  <style>
header {
  background-color: purple;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 24px;
}
footer{
  background-color: purple;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 24px;
}

.container {
  display: flex;
  height: 70vh;
  gap: 10px;
  padding: 10px;
}


.box {
  background-color:palevioletred;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}
.left{
    width: 25%;
    
}
.middle{
   width: 27%;
}
.right{
    width: 70%;
    
}

  </style>
</head>
<body>

  <header>Header</header>

  <div class="container">
    <div class="box left">Inbox etc.</div>
    <div class="box middle">Message list</div>
    <div class="box right">Message</div>
  </div>

  <footer>Footer</footer>

</body>
</html>
