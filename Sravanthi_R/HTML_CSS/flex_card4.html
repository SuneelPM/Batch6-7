<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  font-family: Arial;
}

.header {
  background: red;
  color: white;
  text-align: center;
  padding: 20px;
}

.container {
  display: flex;
}

.left {
  background: blue;
  color: white;
  flex: 1;
  padding: 100px;
}

.main {
  background: #4b3f8c;
  color: white;
  flex: 2;
  padding: 100px;
}

.right {
  background: green;
  color: white;
  flex: 1;
  padding: 100px;
}

.footer {
  background: deeppink;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<div class="header">HEADER</div>

<div class="container">
  <div class="left">LEFT SIDEBAR</div>
  <div class="main">MAIN CONTENT</div>
  <div class="right">RIGHT SIDEBAR</div>
</div>

<div class="footer">FOOTER</div>

</body>
</html>
